<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${title} + ' — 내 메모'">내 메모</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #F0F4FF;
            --card: #FFFFFF;
            --nav-bg: #1E1E2E;
            --nav-border: #2E2E42;
            --primary: #6366F1;
            --primary-hover: #4F52D9;
            --danger: #EF4444;
            --danger-hover: #DC2626;
            --success: #10B981;
            --success-hover: #059669;
            --text: #1E293B;
            --muted: #64748B;
            --border: #E2E8F0;
            --shadow-sm: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.06);
            --shadow-md: 0 4px 16px rgba(0,0,0,.10);
            --shadow-lg: 0 10px 32px rgba(0,0,0,.14);
            --radius: 14px;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        /* ── NAV ── */
        nav {
            background: var(--nav-bg);
            border-bottom: 1px solid var(--nav-border);
            height: 56px;
            display: flex;
            align-items: center;
            padding: 0 28px;
            gap: 6px;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .nav-brand {
            font-size: 17px;
            font-weight: 700;
            color: #fff;
            letter-spacing: -.3px;
            margin-right: 18px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .nav-brand-icon {
            width: 30px; height: 30px;
            background: linear-gradient(135deg, #6366F1, #8B5CF6);
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-size: 14px;
        }
        .nav-link {
            color: #94A3B8;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            padding: 6px 14px;
            border-radius: 8px;
            transition: all .15s;
        }
        .nav-link:hover { color: #fff; background: rgba(255,255,255,.08); }
        .nav-link.active { color: #fff; background: rgba(255,255,255,.12); }

        /* ── CONTAINER ── */
        .container { max-width: 1100px; margin: 0 auto; padding: 32px 24px; }

        /* ── PAGE HEADER ── */
        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
        }
        .page-title { font-size: 22px; font-weight: 700; color: var(--text); }
        .page-sub { font-size: 13px; color: var(--muted); margin-top: 2px; }

        /* ── SEARCH BAR ── */
        .search-wrap {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
        }
        .search-input {
            flex: 1;
            height: 42px;
            padding: 0 16px;
            border: 1.5px solid var(--border);
            border-radius: 10px;
            font-size: 14px;
            color: var(--text);
            background: var(--card);
            box-shadow: var(--shadow-sm);
            transition: border-color .15s, box-shadow .15s;
            outline: none;
        }
        .search-input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(99,102,241,.15); }

        /* ── BUTTONS ── */
        .btn {
            display: inline-flex; align-items: center; gap: 6px;
            height: 36px; padding: 0 16px;
            border: none; border-radius: 8px; cursor: pointer;
            font-size: 13px; font-weight: 600;
            text-decoration: none;
            transition: all .15s;
            white-space: nowrap;
        }
        .btn-primary   { background: var(--primary);   color: #fff; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-danger    { background: var(--danger);    color: #fff; }
        .btn-danger:hover { background: var(--danger-hover); }
        .btn-success   { background: var(--success);   color: #fff; }
        .btn-success:hover { background: var(--success-hover); }
        .btn-ghost {
            background: transparent; color: var(--muted);
            border: 1.5px solid var(--border);
        }
        .btn-ghost:hover { color: var(--text); border-color: #b0bec5; background: #f8fafc; }
        .btn-lg { height: 42px; padding: 0 22px; font-size: 14px; border-radius: 10px; }

        /* ── FORM CARD ── */
        .form-card {
            background: var(--card);
            border-radius: var(--radius);
            padding: 32px;
            box-shadow: var(--shadow-md);
        }
        .form-group { margin-bottom: 20px; }
        .form-label {
            display: block;
            font-size: 13px; font-weight: 600; color: var(--text);
            margin-bottom: 7px;
        }
        .form-control {
            width: 100%;
            padding: 10px 14px;
            border: 1.5px solid var(--border);
            border-radius: 9px;
            font-size: 14px;
            font-family: inherit;
            color: var(--text);
            background: #FAFBFF;
            transition: border-color .15s, box-shadow .15s;
            outline: none;
        }
        .form-control:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(99,102,241,.15); background: #fff; }
        .form-control.mono { font-family: 'Consolas', 'Courier New', monospace; font-size: 13px; }
        textarea.form-control { min-height: 140px; resize: vertical; line-height: 1.7; }
        .form-actions { display: flex; gap: 10px; margin-top: 24px; }

        /* ── EMPTY ── */
        .empty-state {
            text-align: center; padding: 80px 24px;
            color: var(--muted);
        }
        .empty-icon { font-size: 48px; margin-bottom: 16px; opacity: .4; }
        .empty-text { font-size: 15px; }

        /* ── TABLE (bookmarks) ── */
        .data-table {
            width: 100%; border-collapse: collapse;
            background: var(--card);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow-md);
        }
        .data-table th {
            background: #F8FAFF;
            color: var(--muted);
            font-size: 12px; font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .5px;
            padding: 12px 18px;
            text-align: left;
            border-bottom: 1.5px solid var(--border);
        }
        .data-table td {
            padding: 14px 18px;
            font-size: 14px;
            border-bottom: 1px solid #F1F5F9;
            vertical-align: middle;
        }
        .data-table tr:last-child td { border-bottom: none; }
        .data-table tr:hover td { background: #FAFBFF; }
        .data-table .actions { display: flex; gap: 6px; }

        /* ── BADGE ── */
        .badge {
            display: inline-flex; align-items: center;
            padding: 2px 10px;
            border-radius: 99px;
            font-size: 11px; font-weight: 700;
            letter-spacing: .3px;
        }

        /* ── LINK ── */
        a.data-link { color: var(--primary); text-decoration: none; font-weight: 500; }
        a.data-link:hover { text-decoration: underline; }
    </style>
</head>
</html>
