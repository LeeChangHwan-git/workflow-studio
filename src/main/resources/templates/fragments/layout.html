<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${title} + ' — 내 메모'">내 메모</title>
    <script>
        // 파이프라인 탭의 마지막 위치 기억: 다른 메뉴에서 '파이프라인'을 누르면 마지막으로 보던
        // 목록/편집 화면으로 이동 (편집 화면 주소는 에디터(React)가 저장)
        (function () {
            var KEY = 'nav-last-pipelines-url';
            var path = location.pathname;
            try {
                if (path === '/pipelines') localStorage.setItem(KEY, '/pipelines');
                document.addEventListener('DOMContentLoaded', function () {
                    if (path.indexOf('/pipelines') === 0) return; // 파이프라인 탭 안에서는 항상 목록으로
                    var last = localStorage.getItem(KEY);
                    var link = document.querySelector('nav a.nav-link[href="/pipelines"]');
                    if (last && link) link.setAttribute('href', last);
                });
            } catch (e) { /* localStorage 사용 불가 시 기본 동작 */ }
        })();

    </script>
    <!-- 서버 재시작 감지(→ 새로고침) + 열린 앱 탭 관리(상단 "탭 N/M" 배지). 공유 워커로 브라우저당 연결 1개 -->
    <script src="/js/app-session.js?v=2" defer></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg:           #1E1E1E;
            --bg-2:         #252526;
            --bg-3:         #2D2D30;
            --card:         #252526;
            --nav-bg:       #3C3C3C;
            --nav-border:   #252526;
            --primary:      #0E639C;
            --primary-hover:#1177BB;
            --primary-text: #4FC1FF;
            --danger:       #F14C4C;
            --danger-hover: #CD3131;
            --success:      #4EC9B0;
            --success-hover:#3DAF9A;
            --text:         #D4D4D4;
            --muted:        #9E9E9E;
            --dim:          #6A6A6A;
            --border:       #454545;
            --input-bg:     #3C3C3C;
            --shadow-sm:    0 1px 4px rgba(0,0,0,.5);
            --shadow-md:    0 4px 16px rgba(0,0,0,.6);
            --shadow-lg:    0 10px 32px rgba(0,0,0,.7);
            --radius:       6px;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        /* ── NAV ── */
        nav {
            background: var(--nav-bg);
            border-bottom: 1px solid var(--nav-border);
            height: 56px;
            display: flex;
            align-items: center;
            padding: 0 28px;
            gap: 6px;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .nav-brand {
            font-size: 17px;
            font-weight: 700;
            color: #fff;
            letter-spacing: -.3px;
            margin-right: 18px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .nav-brand-icon {
            width: 30px; height: 30px;
            background: linear-gradient(135deg, #0E639C, #0D7377);
            border-radius: 6px;
            display: flex; align-items: center; justify-content: center;
            font-size: 14px;
        }
        .nav-link {
            color: #BBBBBB;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            padding: 6px 14px;
            border-radius: 4px;
            transition: all .15s;
        }
        .nav-link:hover { color: #fff; background: rgba(255,255,255,.1); }
        .nav-link.active { color: #fff; background: rgba(255,255,255,.15); }

        /* ── CONTAINER ── */
        .container { max-width: 1100px; margin: 0 auto; padding: 32px 24px; }

        /* ── PAGE HEADER ── */
        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
        }
        .page-title { font-size: 22px; font-weight: 700; color: var(--text); }
        .page-sub { font-size: 13px; color: var(--muted); margin-top: 2px; }

        /* ── SEARCH BAR ── */
        .search-wrap { display: flex; gap: 8px; margin-bottom: 24px; }
        .search-input {
            flex: 1;
            height: 42px;
            padding: 0 16px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font-size: 14px;
            color: var(--text);
            background: var(--input-bg);
            outline: none;
            transition: border-color .15s;
        }
        .search-input:focus { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(14,99,156,.3); }
        .search-input::placeholder { color: var(--dim); }

        /* ── BUTTONS ── */
        .btn {
            display: inline-flex; align-items: center; gap: 6px;
            height: 36px; padding: 0 16px;
            border: none; border-radius: var(--radius); cursor: pointer;
            font-size: 13px; font-weight: 600;
            text-decoration: none;
            transition: all .15s;
            white-space: nowrap;
            color: #D4D4D4;
        }
        .btn-primary   { background: #0E639C; color: #ffffff; }
        .btn-primary:hover { background: #1177BB; }
        .btn-danger    { background: #F14C4C; color: #ffffff; }
        .btn-danger:hover { background: #CD3131; }
        .btn-success   { background: #4EC9B0; color: #0D2219; }
        .btn-success:hover { background: #3DAF9A; }
        .btn-ghost {
            background: transparent;
            color: #D4D4D4;
            border: 1px solid #454545;
        }
        .btn-ghost:hover { color: #ffffff; border-color: #6A6A6A; background: #2D2D30; }
        .btn-lg { height: 42px; padding: 0 22px; font-size: 14px; border-radius: var(--radius); }

        /* ── FORM CARD ── */
        .form-card {
            background: var(--card);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            padding: 32px;
            box-shadow: var(--shadow-md);
        }
        .form-group { margin-bottom: 20px; }
        .form-label {
            display: block;
            font-size: 12px; font-weight: 600; color: var(--muted);
            margin-bottom: 7px;
            text-transform: uppercase;
            letter-spacing: .4px;
        }
        .form-control {
            width: 100%;
            padding: 9px 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font-size: 14px;
            font-family: inherit;
            color: var(--text);
            background: var(--input-bg);
            transition: border-color .15s;
            outline: none;
        }
        .form-control:focus { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(14,99,156,.25); }
        .form-control.mono { font-family: 'Consolas', 'D2Coding', 'Courier New', monospace; font-size: 13px; }
        textarea.form-control { min-height: 140px; resize: vertical; line-height: 1.7; }
        .form-control::placeholder { color: var(--dim); }
        select.form-control option { background: var(--input-bg); color: var(--text); }
        .form-actions { display: flex; gap: 10px; margin-top: 24px; }

        /* ── EMPTY ── */
        .empty-state { text-align: center; padding: 80px 24px; color: var(--dim); }
        .empty-icon { font-size: 48px; margin-bottom: 16px; opacity: .3; }
        .empty-text { font-size: 15px; }

        /* ── TABLE ── */
        .data-table {
            width: 100%; border-collapse: collapse;
            background: var(--card);
            border-radius: var(--radius);
            overflow: hidden;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-md);
        }
        .data-table th {
            background: var(--bg-3);
            color: var(--muted);
            font-size: 11px; font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .5px;
            padding: 12px 18px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }
        .data-table td {
            padding: 14px 18px;
            font-size: 14px;
            border-bottom: 1px solid var(--border);
            vertical-align: middle;
            color: var(--text);
        }
        .data-table tr:last-child td { border-bottom: none; }
        .data-table tr:hover td { background: var(--bg-3); }
        .data-table .actions { display: flex; gap: 6px; }

        /* ── BADGE ── */
        .badge {
            display: inline-flex; align-items: center;
            padding: 2px 10px;
            border-radius: 3px;
            font-size: 11px; font-weight: 700;
            letter-spacing: .3px;
        }

        /* ── LINK ── */
        a.data-link { color: var(--primary-text); text-decoration: none; font-weight: 500; }
        a.data-link:hover { text-decoration: underline; }

        /* ── SCROLLBAR ── */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: #555; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #777; }
    </style>
</head>
</html>
