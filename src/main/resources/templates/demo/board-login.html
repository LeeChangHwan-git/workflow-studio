<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>KB그룹웨어 — 로그인</title>
<style>
  body { margin: 0; font: 13px 'Malgun Gothic', sans-serif; background: #2B3A55; display: flex; align-items: center; justify-content: center; height: 100vh; }
  .login { background: #fff; padding: 30px 34px; width: 300px; border-radius: 4px; }
  h1 { font-size: 18px; margin: 0 0 4px; } h1 i { color: #E0A800; font-style: normal; }
  p { color: #888; font-size: 12px; margin: 0 0 18px; line-height: 1.6; }
  input { width: 100%; box-sizing: border-box; height: 32px; margin-bottom: 8px; border: 1px solid #CCC; padding: 0 8px; }
  button { width: 100%; height: 36px; background: #1F4E9B; color: #fff; border: none; font-weight: bold; cursor: pointer; }
</style>
</head>
<body>
<form class="login" method="post" action="/demo-board/login" autocomplete="off">
  <h1><i>KB</i> 그룹웨어</h1>
  <p>로그인이 필요합니다.<br>(시연용 — 아무 값이나 넣고 로그인하면 쿠키 GW_SESSION 이 생깁니다)</p>
  <input name="user" placeholder="아이디 (시연용, 아무거나)" autocomplete="off">
  <input name="pw" type="text" placeholder="비밀번호 칸 없음 (시연용)" disabled>
  <button>로그인</button>
</form>
</body>
</html>
