<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title th:text="${post.title} + ' — KB그룹웨어'">글</title>
<style>
  body { margin: 0; font: 13px 'Malgun Gothic', Dotum, sans-serif; background: #F3F3F3; color: #333; }
  .gw-top { background: #2B3A55; color: #fff; height: 42px; display: flex; align-items: center; padding: 0 18px; }
  .gw-top b i { color: #FFBC00; font-style: normal; }
  .box { max-width: 860px; margin: 18px auto; background: #fff; border-top: 2px solid #555; padding: 0 0 20px; }
  .head { padding: 12px 16px; border-bottom: 1px solid #DDD; }
  .head h1 { font-size: 16px; margin: 0 0 6px; }
  .head div { color: #888; font-size: 12px; }
  .post-body { padding: 18px 16px; line-height: 1.8; }
  a { color: #1F4E9B; margin-left: 16px; }
</style>
</head>
<body>
<div class="gw-top"><b><i>KB</i> 그룹웨어</b></div>
<div class="box">
  <div class="head"><h1 class="post-title" th:text="'[' + ${post.category} + '] ' + ${post.title}"></h1>
    <div><span class="writer" th:text="${post.writer} + ' (' + ${post.dept} + ')'"></span> · <span th:text="${post.date}"></span> · 조회 <span th:text="${post.views}"></span></div></div>
  <div class="post-body" th:text="${post.body}"></div>
  <a href="/demo-board">← 목록</a>
</div>
</body>
</html>
