<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout :: head('설정')"></head>
<body>
<nav>
    <div class="nav-brand"><div class="nav-brand-icon">🗂</div>내 메모</div>
    <a th:href="@{/memos}"     class="nav-link">메모</a>
    <a th:href="@{/bookmarks}" class="nav-link">북마크</a>
    <a th:href="@{/calendar}"  class="nav-link">달력</a>
    <a th:href="@{/pipelines}" class="nav-link">파이프라인</a>
    <a th:href="@{/settings}"  class="nav-link active">설정</a>
</nav>

<div class="container" style="max-width:640px;">
    <div class="page-header">
        <div>
            <div class="page-title">설정</div>
            <div class="page-sub">AI 및 자동화 설정을 관리합니다</div>
        </div>
    </div>

    <div class="form-card">
        <h3 style="font-size:15px;font-weight:700;color:#1E293B;margin-bottom:20px;">🤖 Claude AI 설정</h3>

        <div class="form-group">
            <label class="form-label">Claude API 키</label>
            <input class="form-control" type="password" id="claudeApiKey"
                   placeholder="sk-ant-api03-..."
                   th:value="${settings.claudeApiKey}">
            <div style="font-size:11px;color:#94A3B8;margin-top:5px;">
                AI 질의 노드 사용에 필요합니다.
                Anthropic Console에서 발급 후 입력하세요.
            </div>
        </div>

        <div class="form-group">
            <label class="form-label">기본 모델</label>
            <select class="form-control" id="claudeModel">
                <option value="claude-sonnet-4-6"
                        th:selected="${settings.claudeModel == 'claude-sonnet-4-6'}">
                    claude-sonnet-4-6 (권장)
                </option>
                <option value="claude-haiku-4-5-20251001"
                        th:selected="${settings.claudeModel == 'claude-haiku-4-5-20251001'}">
                    claude-haiku-4-5 (빠름)
                </option>
                <option value="claude-opus-4-8"
                        th:selected="${settings.claudeModel == 'claude-opus-4-8'}">
                    claude-opus-4-8 (고성능)
                </option>
            </select>
        </div>

        <hr style="border:none;border-top:1px solid #F1F5F9;margin:24px 0;">

        <h3 style="font-size:15px;font-weight:700;color:#1E293B;margin-bottom:20px;">🖱️ 이미지 매칭 설정</h3>

        <div class="form-group">
            <label class="form-label">이미지 일치 임계값 (0.1 ~ 1.0)</label>
            <input class="form-control" type="number" id="imageMatchThreshold"
                   min="0.1" max="1.0" step="0.05"
                   th:value="${settings.imageMatchThreshold}">
            <div style="font-size:11px;color:#94A3B8;margin-top:5px;">
                높을수록 정확하지만 찾기 어려워짐. 기본값: 0.90
            </div>
        </div>

        <div class="form-group">
            <label class="form-label">이미지 탐색 재시도 간격 (ms)</label>
            <input class="form-control" type="number" id="imageMatchRetryMs"
                   min="100" max="5000" step="100"
                   th:value="${settings.imageMatchRetryMs}">
            <div style="font-size:11px;color:#94A3B8;margin-top:5px;">
                화면 이미지를 못 찾을 때 재시도 간격. 기본값: 500
            </div>
        </div>

        <div class="form-actions">
            <button class="btn btn-primary btn-lg" onclick="saveSettings()">저장</button>
            <a th:href="@{/pipelines}" class="btn btn-ghost btn-lg">파이프라인으로</a>
        </div>
    </div>

    <div id="toast" style="display:none;margin-top:16px;padding:12px 18px;
         background:#F0FDF4;color:#16A34A;border-radius:10px;
         font-size:14px;font-weight:600;">
        ✅ 설정이 저장되었습니다.
    </div>
</div>

<script>
async function saveSettings() {
    const payload = {
        claudeApiKey: document.getElementById('claudeApiKey').value,
        claudeModel:  document.getElementById('claudeModel').value,
        imageMatchThreshold: parseFloat(document.getElementById('imageMatchThreshold').value) || 0.90,
        imageMatchRetryMs:   parseInt(document.getElementById('imageMatchRetryMs').value) || 500
    };
    const r = await fetch('/api/settings', {
        method: 'PUT',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(payload)
    });
    if (r.ok) {
        const toast = document.getElementById('toast');
        toast.style.display = 'block';
        setTimeout(() => { toast.style.display = 'none'; }, 2500);
    } else {
        alert('저장 실패');
    }
}
</script>
</body>
</html>
