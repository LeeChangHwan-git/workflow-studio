<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout :: head('달력')"></head>
<style>
  /* ── 전체 레이아웃 ── */
  body { overflow: hidden; }
  .cal-wrap {
    display: flex;
    height: calc(100vh - 56px);
    gap: 0;
  }

  /* ── 왼쪽: 달력 패널 ── */
  .cal-panel {
    flex: 1 1 0;
    min-width: 0;
    display: flex;
    flex-direction: column;
    padding: 24px 20px 16px 28px;
    overflow: hidden;
  }

  /* 월 네비게이션 */
  .cal-nav {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 20px;
  }
  .cal-nav-btn {
    width: 36px; height: 36px;
    border: none; border-radius: 50%; cursor: pointer;
    background: #EEF2FF; color: #6366F1; font-size: 16px;
    display: flex; align-items: center; justify-content: center;
    transition: background .15s;
    text-decoration: none;
  }
  .cal-nav-btn:hover { background: #E0E7FF; }
  .cal-title {
    font-size: 22px; font-weight: 800; color: #1E293B;
    flex: 1;
  }
  .cal-today-btn {
    height: 32px; padding: 0 14px;
    border: 1.5px solid #E2E8F0; border-radius: 8px;
    background: #fff; color: #64748B;
    font-size: 13px; font-weight: 600;
    cursor: pointer; text-decoration: none;
    display: flex; align-items: center;
    transition: all .15s;
  }
  .cal-today-btn:hover { border-color: #6366F1; color: #6366F1; }

  /* 요일 헤더 */
  .cal-dow {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
    margin-bottom: 6px;
  }
  .cal-dow-cell {
    text-align: center;
    font-size: 12px; font-weight: 700;
    color: #94A3B8;
    padding: 4px 0;
  }
  .cal-dow-cell:first-child { color: #EF4444; }
  .cal-dow-cell:last-child  { color: #3B82F6; }

  /* 날짜 그리드 */
  .cal-grid {
    display: flex;
    flex-direction: column;
    gap: 4px;
    flex: 1;
  }
  .cal-week {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
    flex: 1;
  }
  .cal-day {
    border-radius: 10px;
    padding: 6px 8px;
    cursor: pointer;
    position: relative;
    display: flex;
    flex-direction: column;
    transition: background .15s, box-shadow .15s;
    min-height: 0;
    border: 2px solid transparent;
    background: #fff;
  }
  .cal-day:hover { background: #F5F7FF; }
  .cal-day.other-month { background: #F8FAFC; }
  .cal-day.other-month .day-num { color: #CBD5E1; }
  .cal-day.is-today { border-color: #6366F1; }
  .cal-day.selected { background: #EEF2FF; border-color: #6366F1; box-shadow: 0 0 0 2px #C7D2FE; }
  .cal-day.selected .day-num { color: #4F46E5; font-weight: 800; }

  .day-num {
    font-size: 14px; font-weight: 700;
    color: #334155;
    line-height: 1;
  }
  .cal-day.sun .day-num { color: #EF4444; }
  .cal-day.sat .day-num { color: #3B82F6; }
  .cal-day.other-month .day-num { color: #CBD5E1 !important; }
  .cal-day.is-today .day-num {
    width: 24px; height: 24px;
    background: #6366F1; color: #fff;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px;
  }

  /* 이벤트 점 & 미리보기 */
  .day-events {
    margin-top: 4px;
    display: flex;
    flex-direction: column;
    gap: 2px;
    overflow: hidden;
    flex: 1;
  }
  .day-event-pill {
    font-size: 10px;
    font-weight: 600;
    padding: 1px 5px;
    border-radius: 4px;
    background: #EEF2FF;
    color: #6366F1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    line-height: 1.4;
  }
  .day-event-more {
    font-size: 10px;
    color: #94A3B8;
    font-weight: 600;
    padding-left: 3px;
  }

  /* ── 오른쪽: 날짜 상세 패널 ── */
  .day-panel {
    width: 360px;
    min-width: 320px;
    flex-shrink: 0;
    border-left: 1.5px solid #E2E8F0;
    background: #fff;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .day-panel-header {
    padding: 24px 24px 16px;
    border-bottom: 1.5px solid #F1F5F9;
    flex-shrink: 0;
  }
  .day-panel-date {
    font-size: 20px; font-weight: 800; color: #1E293B;
    line-height: 1.2;
  }
  .day-panel-sub {
    font-size: 12px; color: #94A3B8; margin-top: 4px;
  }
  .day-panel-empty {
    text-align: center;
    padding: 48px 24px;
    color: #CBD5E1;
    font-size: 14px;
  }

  /* 이벤트 목록 */
  .day-events-list {
    flex: 1;
    overflow-y: auto;
    padding: 12px 20px;
  }
  .day-events-list::-webkit-scrollbar { width: 4px; }
  .day-events-list::-webkit-scrollbar-thumb { background: #E2E8F0; border-radius: 4px; }

  .event-item {
    background: #F8FAFC;
    border: 1.5px solid #E2E8F0;
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 10px;
    position: relative;
  }
  .event-item-title {
    font-size: 13px; font-weight: 700; color: #1E293B;
    margin-bottom: 4px;
  }
  .event-item-content {
    font-size: 13px; color: #475569;
    white-space: pre-wrap; line-height: 1.6;
  }
  .event-item-actions {
    display: flex; gap: 6px;
    margin-top: 10px;
  }
  .btn-ev {
    height: 28px; padding: 0 10px;
    border-radius: 6px; font-size: 11px; font-weight: 700;
    cursor: pointer; border: none; transition: all .15s;
  }
  .btn-ev-edit { background: #EEF2FF; color: #6366F1; }
  .btn-ev-edit:hover { background: #E0E7FF; }
  .btn-ev-del  { background: #FEF2F2; color: #EF4444; }
  .btn-ev-del:hover  { background: #FEE2E2; }

  /* 인라인 수정 폼 */
  .edit-form { margin-top: 8px; }
  .edit-form input, .edit-form textarea {
    width: 100%; padding: 7px 10px;
    border: 1.5px solid #E2E8F0; border-radius: 7px;
    font-size: 13px; font-family: inherit;
    margin-bottom: 6px; outline: none;
    transition: border-color .15s;
  }
  .edit-form input:focus, .edit-form textarea:focus { border-color: #6366F1; }
  .edit-form textarea { min-height: 72px; resize: vertical; }
  .edit-form-actions { display: flex; gap: 6px; }

  /* 추가 폼 */
  .add-form-wrap {
    padding: 14px 20px 18px;
    border-top: 1.5px solid #F1F5F9;
    flex-shrink: 0;
  }
  .add-form-label {
    font-size: 12px; font-weight: 700; color: #94A3B8;
    margin-bottom: 8px; letter-spacing: .3px;
  }
  .add-form input, .add-form textarea {
    width: 100%; padding: 8px 12px;
    border: 1.5px solid #E2E8F0; border-radius: 8px;
    font-size: 13px; font-family: inherit;
    margin-bottom: 8px; outline: none;
    background: #F8FAFC;
    transition: border-color .15s, background .15s;
  }
  .add-form input:focus, .add-form textarea:focus {
    border-color: #6366F1; background: #fff;
  }
  .add-form textarea { min-height: 70px; resize: none; }
  .btn-add-submit {
    width: 100%; height: 36px;
    background: #6366F1; color: #fff;
    border: none; border-radius: 8px;
    font-size: 13px; font-weight: 700;
    cursor: pointer; transition: background .15s;
  }
  .btn-add-submit:hover { background: #4F46E5; }

  /* 날짜 없을 때 안내 */
  .no-date-guide {
    flex: 1;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    color: #CBD5E1; padding: 24px;
    text-align: center;
  }
  .no-date-guide .icon { font-size: 42px; margin-bottom: 12px; opacity: .5; }
  .no-date-guide .text { font-size: 14px; line-height: 1.6; }
</style>
<body>
<nav>
  <div class="nav-brand"><div class="nav-brand-icon">🗂</div>내 메모</div>
  <a th:href="@{/memos}"     class="nav-link">메모</a>
  <a th:href="@{/bookmarks}" class="nav-link">북마크</a>
  <a th:href="@{/calendar}"  class="nav-link active">달력</a>
</nav>

<div class="cal-wrap">
  <!-- ────── 왼쪽: 달력 ────── -->
  <div class="cal-panel">
    <div class="cal-nav">
      <a th:href="@{/calendar(year=${prevYear},month=${prevMonth})}" class="cal-nav-btn">&#8249;</a>
      <span class="cal-title"
            th:text="${currentYear} + '년 ' + ${currentMonth} + '월'"></span>
      <a th:href="@{/calendar}" class="cal-today-btn">오늘</a>
      <a th:href="@{/calendar(year=${nextYear},month=${nextMonth})}" class="cal-nav-btn">&#8250;</a>
    </div>

    <div class="cal-dow">
      <div class="cal-dow-cell">일</div>
      <div class="cal-dow-cell">월</div>
      <div class="cal-dow-cell">화</div>
      <div class="cal-dow-cell">수</div>
      <div class="cal-dow-cell">목</div>
      <div class="cal-dow-cell">금</div>
      <div class="cal-dow-cell">토</div>
    </div>

    <div class="cal-grid">
      <div class="cal-week" th:each="week : ${weeks}">
        <th:block th:each="day, ds : ${week}">
          <th:block th:with="
            isOther=${day.monthValue != currentMonth},
            isToday=${day.equals(today)},
            isSun=${ds.index == 0},
            isSat=${ds.index == 6},
            dateStr=${day.toString()}
          ">
            <div class="cal-day"
                 th:classappend="${isOther ? 'other-month ' : ''} + ${isToday ? 'is-today ' : ''} + ${isSun ? 'sun ' : ''} + ${isSat ? 'sat' : ''}"
                 th:attr="data-date=${dateStr}, data-month=${day.monthValue}, data-year=${day.year}"
                 onclick="selectDay(this)">
              <div class="day-num" th:text="${day.dayOfMonth}"></div>
              <div class="day-events" th:attr="id='pills-' + ${dateStr}">
                <!-- JS가 동적으로 채움 -->
              </div>
            </div>
          </th:block>
        </th:block>
      </div>
    </div>
  </div>

  <!-- ────── 오른쪽: 날짜 상세 ────── -->
  <div class="day-panel" id="dayPanel">
    <div class="no-date-guide">
      <div class="icon">📅</div>
      <div class="text">날짜를 클릭하면<br>일정을 확인하고<br>추가할 수 있어요</div>
    </div>
  </div>
</div>

<!-- 이벤트 데이터 (서버에서 주입) -->
<script th:inline="javascript">
  const EVENTS  = /*[[${eventsJson}]]*/ '{}';
  const CUR_YEAR  = /*[[${currentYear}]]*/ 0;
  const CUR_MONTH = /*[[${currentMonth}]]*/ 0;
  const eventsMap = JSON.parse(EVENTS);

  /* ── 달력 이벤트 뱃지 렌더링 ── */
  (function initPills() {
    Object.keys(eventsMap).forEach(dateStr => {
      const container = document.getElementById('pills-' + dateStr);
      if (!container) return;
      const list = eventsMap[dateStr];
      const shown = list.slice(0, 2);
      shown.forEach(ev => {
        const pill = document.createElement('div');
        pill.className = 'day-event-pill';
        pill.textContent = ev.title || ev.content.split('\n')[0] || '일정';
        container.appendChild(pill);
      });
      if (list.length > 2) {
        const more = document.createElement('div');
        more.className = 'day-event-more';
        more.textContent = '+' + (list.length - 2) + '개 더';
        container.appendChild(more);
      }
    });
  })();

  /* ── 날짜 선택 ── */
  let selectedDate = null;

  function selectDay(el) {
    document.querySelectorAll('.cal-day.selected').forEach(d => d.classList.remove('selected'));
    el.classList.add('selected');

    const dateStr = el.getAttribute('data-date');
    selectedDate = dateStr;
    renderDayPanel(dateStr);
  }

  /* ── 오른쪽 패널 렌더링 ── */
  function renderDayPanel(dateStr) {
    const [y, m, d] = dateStr.split('-').map(Number);
    const dow = ['일','월','화','수','목','금','토'][new Date(y, m-1, d).getDay()];
    const label = y + '년 ' + m + '월 ' + d + '일 (' + dow + ')';
    const events = eventsMap[dateStr] || [];

    let eventsHtml = '';
    if (events.length === 0) {
      eventsHtml = '<div class="day-panel-empty">등록된 일정이 없어요</div>';
    } else {
      events.forEach(ev => {
        const title   = escHtml(ev.title || '');
        const content = escHtml(ev.content || '');
        eventsHtml += `
          <div class="event-item" id="ev-${ev.id}">
            ${title ? `<div class="event-item-title">${title}</div>` : ''}
            <div class="event-item-content">${content}</div>
            <div class="event-item-actions">
              <button class="btn-ev btn-ev-edit" onclick="showEditForm('${ev.id}','${escJs(ev.title)}','${escJs(ev.content)}','${dateStr}')">수정</button>
              <form action="/calendar/${ev.id}/delete" method="post" style="display:inline;" onsubmit="return confirm('삭제하시겠습니까?')">
                <input type="hidden" name="year"  value="${CUR_YEAR}">
                <input type="hidden" name="month" value="${CUR_MONTH}">
                <button type="submit" class="btn-ev btn-ev-del">삭제</button>
              </form>
            </div>
          </div>`;
      });
    }

    const addForm = `
      <div class="add-form-wrap">
        <div class="add-form-label">+ 일정 추가</div>
        <form class="add-form" action="/calendar" method="post">
          <input type="hidden" name="date"  value="${dateStr}">
          <input type="hidden" name="year"  value="${CUR_YEAR}">
          <input type="hidden" name="month" value="${CUR_MONTH}">
          <input type="text" name="title" placeholder="제목 (선택)"/>
          <textarea name="content" placeholder="내용을 입력하세요" required></textarea>
          <button type="submit" class="btn-add-submit">저장</button>
        </form>
      </div>`;

    document.getElementById('dayPanel').innerHTML = `
      <div class="day-panel-header">
        <div class="day-panel-date">${label}</div>
        <div class="day-panel-sub">${events.length}개의 일정</div>
      </div>
      <div class="day-events-list">${eventsHtml}</div>
      ${addForm}`;
  }

  /* ── 인라인 수정 폼 ── */
  function showEditForm(id, title, content, dateStr) {
    const item = document.getElementById('ev-' + id);
    item.innerHTML = `
      <form class="edit-form" action="/calendar/${id}/edit" method="post">
        <input type="hidden" name="date"  value="${dateStr}">
        <input type="hidden" name="year"  value="${CUR_YEAR}">
        <input type="hidden" name="month" value="${CUR_MONTH}">
        <input type="text" name="title" value="${escAttr(title)}" placeholder="제목 (선택)"/>
        <textarea name="content" required>${escHtml(content)}</textarea>
        <div class="edit-form-actions">
          <button type="submit" class="btn btn-primary" style="height:30px;padding:0 12px;font-size:12px;">저장</button>
          <button type="button" class="btn btn-ghost" style="height:30px;padding:0 12px;font-size:12px;" onclick="renderDayPanel('${dateStr}')">취소</button>
        </div>
      </form>`;
  }

  /* ── 유틸 ── */
  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function escJs(s) {
    return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\n/g,'\\n');
  }
  function escAttr(s) {
    return String(s).replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }
</script>
</body>
</html>
