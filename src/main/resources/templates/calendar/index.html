<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout :: head('달력')"></head>
<style>
  body { overflow: hidden; }
  .cal-wrap {
    display: flex;
    height: calc(100vh - 56px);
    gap: 0;
  }
  .cal-panel {
    flex: 1 1 0;
    min-width: 0;
    display: flex;
    flex-direction: column;
    padding: 20px 16px 14px 24px;
    overflow: hidden;
  }
  .cal-nav {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
  }
  .cal-nav-btn {
    width: 32px; height: 32px;
    border: 1px solid var(--border); border-radius: var(--radius); cursor: pointer;
    background: var(--bg-3); color: var(--text); font-size: 15px;
    display: flex; align-items: center; justify-content: center;
    transition: background .15s, border-color .15s;
    text-decoration: none;
  }
  .cal-nav-btn:hover { background: #3E3E42; border-color: #606060; }
  .cal-title {
    font-size: 20px; font-weight: 700; color: var(--text);
    flex: 1;
  }
  .cal-today-btn {
    height: 30px; padding: 0 13px;
    border: 1px solid var(--border); border-radius: var(--radius);
    background: var(--bg-3); color: var(--muted);
    font-size: 12px; font-weight: 600;
    cursor: pointer; text-decoration: none;
    display: flex; align-items: center;
    transition: all .15s;
  }
  .cal-today-btn:hover { border-color: var(--primary-text); color: var(--primary-text); }

  .cal-dow {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 3px;
    margin-bottom: 4px;
  }
  .cal-dow-cell {
    text-align: center;
    font-size: 11px; font-weight: 700;
    color: var(--dim);
    padding: 4px 0;
    letter-spacing: .3px;
    text-transform: uppercase;
  }
  .cal-dow-cell:first-child { color: #F14C4C; }
  .cal-dow-cell:last-child  { color: #569CD6; }

  /* 주(행) 높이를 모두 같게 고정 — 일정이 많아도 칸이 늘어나지 않음 (넘치는 건 "+N개 더") */
  .cal-grid {
    display: flex;
    flex-direction: column;
    gap: 3px;
    flex: 1 1 0;
    min-height: 0;
  }
  .cal-week {
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
    grid-template-rows: minmax(0, 1fr);
    gap: 3px;
    flex: 1 1 0;
    min-height: 0;
  }
  .cal-day {
    border-radius: var(--radius);
    padding: 5px 7px;
    cursor: pointer;
    position: relative;
    display: flex;
    flex-direction: column;
    transition: background .12s, border-color .12s;
    min-height: 0;
    min-width: 0;
    overflow: hidden;
    border: 1px solid transparent;
    background: var(--bg-2);
  }
  .cal-day:hover { background: var(--bg-3); border-color: var(--border); }
  .cal-day.other-month { background: #1A1A1A; opacity: .5; }
  .cal-day.is-today { border-color: #0E639C; }
  .cal-day.selected { background: #1E3A5F; border-color: #0E639C; }
  .cal-day.selected .day-num { color: #4FC1FF; font-weight: 800; }

  .day-num {
    font-size: 13px; font-weight: 600;
    color: var(--text);
    line-height: 1;
  }
  .cal-day.sun .day-num { color: #F14C4C; }
  .cal-day.sat .day-num { color: #569CD6; }
  .cal-day.other-month .day-num { color: var(--dim) !important; }
  .cal-day.is-today .day-num {
    width: 22px; height: 22px;
    background: #0E639C; color: #fff;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px;
  }

  .day-events {
    margin-top: 3px;
    display: flex;
    flex-direction: column;
    gap: 2px;
    overflow: hidden;
    flex: 1 1 0;
    min-height: 0;
  }
  .day-events > * { flex-shrink: 0; }
  .day-events .fit-hidden { display: none; }
  .day-event-pill {
    font-size: 10px; font-weight: 600;
    padding: 1px 5px;
    border-radius: 3px;
    background: #1E3A5F; color: #4FC1FF;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    line-height: 1.4;
  }
  /* ⏰ 타이머 일정 */
  .day-timer-pill {
    font-size: 10px; font-weight: 600; padding: 1px 5px; border-radius: 3px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.4;
    background: rgba(197,134,192,.14); color: #D7A8D3; border: 1px dashed rgba(197,134,192,.55);
  }
  .day-timer-pill.fired   { background: rgba(78,201,176,.14); color: #4EC9B0; border: 1px solid rgba(78,201,176,.4); }
  .day-timer-pill.error   { background: rgba(241,76,76,.15); color: #F48771; border: 1px solid rgba(241,76,76,.45); }
  .day-timer-pill.skipped { background: #2A2A2A; color: #888; border: 1px solid #444; }
  body.hide-timers .day-timer-pill, body.hide-timers .timer-section { display: none; }
  .cal-timer-toggle {
    display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted);
    cursor: pointer; user-select: none; margin-right: 6px;
  }
  .cal-timer-toggle input { accent-color: #C586C0; }
  .timer-section { padding: 4px 0 6px; }
  .timer-section-title {
    font-size: 11px; font-weight: 700; color: #C586C0; letter-spacing: .3px;
    margin: 6px 0 8px; display: flex; align-items: center; gap: 6px;
  }
  .timer-item {
    border: 1px dashed rgba(197,134,192,.5); border-radius: var(--radius);
    padding: 9px 12px; margin-bottom: 7px; background: rgba(197,134,192,.06);
  }
  .timer-item.fired { border: 1px solid rgba(78,201,176,.4); background: rgba(78,201,176,.06); }
  .timer-item.error { border: 1px solid rgba(241,76,76,.45); background: rgba(241,76,76,.07); }
  .timer-item.skipped { border: 1px solid #444; background: #232323; }
  .timer-top { display: flex; align-items: center; gap: 8px; }
  .timer-time { font-size: 13px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  .timer-badge { font-size: 10px; font-weight: 700; padding: 1px 7px; border-radius: 9px; background: rgba(197,134,192,.25); color: #E2C0DF; }
  .timer-item.fired .timer-badge { background: rgba(78,201,176,.2); color: #4EC9B0; }
  .timer-item.error .timer-badge { background: rgba(241,76,76,.25); color: #F48771; }
  .timer-item.skipped .timer-badge { background: #333; color: #999; }
  .timer-name { font-size: 12.5px; margin-top: 4px; }
  .timer-name a { color: #4FC1FF; text-decoration: none; font-weight: 600; }
  .timer-name a:hover { text-decoration: underline; }
  .timer-sub { font-size: 11.5px; color: var(--dim); margin-top: 2px; line-height: 1.5; }
  .timer-msg { font-size: 11.5px; color: #F48771; margin-top: 3px; white-space: pre-wrap; }
  .day-event-more {
    font-size: 10px; color: var(--dim); font-weight: 600; padding-left: 3px;
  }

  .day-panel {
    width: 340px; min-width: 300px; flex-shrink: 0;
    border-left: 1px solid var(--border);
    background: var(--bg-2);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .day-panel-header {
    padding: 20px 20px 14px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .day-panel-date { font-size: 18px; font-weight: 700; color: var(--text); }
  .day-panel-sub  { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .day-panel-empty {
    text-align: center; padding: 40px 20px;
    color: var(--dim); font-size: 13px;
  }
  .day-events-list { flex: 1; overflow-y: auto; padding: 10px 16px; }
  .day-events-list::-webkit-scrollbar { width: 4px; }
  .day-events-list::-webkit-scrollbar-thumb { background: #555; border-radius: 4px; }

  .event-item {
    background: var(--bg-3);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 11px 13px;
    margin-bottom: 8px;
    position: relative;
  }
  .event-item-title { font-size: 13px; font-weight: 700; color: var(--text); margin-bottom: 4px; }
  .event-item-content { font-size: 13px; color: var(--muted); white-space: pre-wrap; line-height: 1.6; }
  .event-item-actions { display: flex; gap: 6px; margin-top: 8px; }
  .btn-ev {
    height: 26px; padding: 0 10px;
    border-radius: var(--radius); font-size: 11px; font-weight: 700;
    cursor: pointer; border: 1px solid transparent; transition: all .15s;
  }
  .btn-ev-edit { background: #1E3A5F; color: #4FC1FF; border-color: #264F78; }
  .btn-ev-edit:hover { background: #264F78; }
  .btn-ev-del  { background: #3A1E1E; color: #F48771; border-color: #5A2D2D; }
  .btn-ev-del:hover  { background: #5A2D2D; }

  .edit-form { margin-top: 8px; }
  .edit-form input, .edit-form textarea {
    width: 100%; padding: 7px 10px;
    border: 1px solid var(--border); border-radius: var(--radius);
    font-size: 13px; font-family: inherit; color: var(--text);
    background: var(--input-bg);
    margin-bottom: 6px; outline: none;
    transition: border-color .15s;
  }
  .edit-form input:focus, .edit-form textarea:focus { border-color: var(--primary); }
  .edit-form input::placeholder, .edit-form textarea::placeholder { color: var(--dim); }
  .edit-form textarea { min-height: 72px; resize: vertical; }
  .edit-form-actions { display: flex; gap: 6px; }

  .add-form-wrap {
    padding: 12px 16px 16px;
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }
  .add-form-label {
    font-size: 11px; font-weight: 700; color: var(--dim);
    margin-bottom: 8px; letter-spacing: .3px; text-transform: uppercase;
  }
  .add-form input, .add-form textarea {
    width: 100%; padding: 7px 10px;
    border: 1px solid var(--border); border-radius: var(--radius);
    font-size: 13px; font-family: inherit; color: var(--text);
    background: var(--input-bg);
    margin-bottom: 7px; outline: none;
    transition: border-color .15s;
  }
  .add-form input:focus, .add-form textarea:focus { border-color: var(--primary); }
  .add-form input::placeholder, .add-form textarea::placeholder { color: var(--dim); }
  .add-form textarea { min-height: 64px; resize: none; }
  .btn-add-submit {
    width: 100%; height: 34px;
    background: var(--primary); color: #fff;
    border: none; border-radius: var(--radius);
    font-size: 13px; font-weight: 700;
    cursor: pointer; transition: background .15s;
  }
  .btn-add-submit:hover { background: var(--primary-hover); }

  .no-date-guide {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    color: var(--dim); padding: 24px; text-align: center;
  }
  .no-date-guide .icon { font-size: 38px; margin-bottom: 12px; opacity: .3; }
  .no-date-guide .text { font-size: 13px; line-height: 1.6; }
</style>
<body>
<nav th:replace="~{fragments/nav :: nav('calendar')}"></nav>

<div class="cal-wrap">
  <div class="cal-panel">
    <div class="cal-nav">
      <a th:href="@{/calendar(year=${prevYear},month=${prevMonth})}" class="cal-nav-btn">&#8249;</a>
      <span class="cal-title"
            th:text="${currentYear} + '년 ' + ${currentMonth} + '월'"></span>
      <label class="cal-timer-toggle" title="파이프라인 타이머의 예정·지난 실행을 달력에 표시">
        <input type="checkbox" id="timerToggle" checked> ⏰ 타이머 표시
      </label>
      <a th:href="@{/calendar}" class="cal-today-btn">오늘</a>
      <a th:href="@{/calendar(year=${nextYear},month=${nextMonth})}" class="cal-nav-btn">&#8250;</a>
    </div>

    <div class="cal-dow">
      <div class="cal-dow-cell">일</div>
      <div class="cal-dow-cell">월</div>
      <div class="cal-dow-cell">화</div>
      <div class="cal-dow-cell">수</div>
      <div class="cal-dow-cell">목</div>
      <div class="cal-dow-cell">금</div>
      <div class="cal-dow-cell">토</div>
    </div>

    <div class="cal-grid">
      <div class="cal-week" th:each="week : ${weeks}">
        <th:block th:each="day, ds : ${week}">
          <th:block th:with="
            isOther=${day.monthValue != currentMonth},
            isToday=${day.equals(today)},
            isSun=${ds.index == 0},
            isSat=${ds.index == 6},
            dateStr=${day.toString()}
          ">
            <div class="cal-day"
                 th:classappend="${isOther ? 'other-month ' : ''} + ${isToday ? 'is-today ' : ''} + ${isSun ? 'sun ' : ''} + ${isSat ? 'sat' : ''}"
                 th:attr="data-date=${dateStr}, data-month=${day.monthValue}, data-year=${day.year}"
                 onclick="selectDay(this)">
              <div class="day-num" th:text="${day.dayOfMonth}"></div>
              <div class="day-events" th:attr="id='pills-' + ${dateStr}"></div>
            </div>
          </th:block>
        </th:block>
      </div>
    </div>
  </div>

  <div class="day-panel" id="dayPanel">
    <div class="no-date-guide">
      <div class="icon">📅</div>
      <div class="text">날짜를 클릭하면<br>일정을 확인하고<br>추가할 수 있어요</div>
    </div>
  </div>
</div>

<script th:inline="javascript">
  const EVENTS    = /*[[${eventsJson}]]*/ '{}';
  const CUR_YEAR  = /*[[${currentYear}]]*/ 0;
  const CUR_MONTH = /*[[${currentMonth}]]*/ 0;
  const eventsMap = JSON.parse(EVENTS);
  const TIMERS    = /*[[${timersJson}]]*/ '{}';
  const timersMap = JSON.parse(TIMERS);
  const TIMER_LABEL = { planned: '예정', fired: '실행됨', error: '오류', skipped: '건너뜀' };

  // 타이머 표시 켜기/끄기 (브라우저에 기억)
  (function initTimerToggle() {
    const box = document.getElementById('timerToggle');
    let show = true;
    try { show = localStorage.getItem('calendar-show-timers') !== '0'; } catch (e) {}
    box.checked = show;
    document.body.classList.toggle('hide-timers', !show);
    box.addEventListener('change', () => {
      document.body.classList.toggle('hide-timers', !box.checked);
      try { localStorage.setItem('calendar-show-timers', box.checked ? '1' : '0'); } catch (e) {}
    });
  })();

  function timerText(t) {
    return t.count ? t.time + '~' + t.until + ' ' + t.count + '회' : t.time;
  }

  // 칸마다 일정 → 타이머 순으로 전부 그린 뒤, 칸 높이에 들어가는 만큼만 보이고 나머지는 "+N개 더"
  (function initPills() {
    const dates = new Set([...Object.keys(eventsMap), ...Object.keys(timersMap)]);
    dates.forEach(dateStr => {
      const container = document.getElementById('pills-' + dateStr);
      if (!container) return;
      (eventsMap[dateStr] || []).forEach(ev => {
        const pill = document.createElement('div');
        pill.className = 'day-event-pill';
        pill.textContent = ev.title || ev.content.split('\n')[0] || '일정';
        pill.title = pill.textContent;
        container.appendChild(pill);
      });
      (timersMap[dateStr] || []).forEach(t => {
        const pill = document.createElement('div');
        pill.className = 'day-timer-pill ' + t.kind;
        const icon = t.kind === 'fired' ? '✓' : t.kind === 'error' ? '✗' : t.kind === 'skipped' ? '–' : '⏰';
        pill.textContent = icon + ' ' + timerText(t) + ' ' + t.pipelineName;
        pill.title = t.pipelineName + ' · ' + t.nodeName + ' (' + TIMER_LABEL[t.kind] + ')';
        container.appendChild(pill);
      });
      const more = document.createElement('div');
      more.className = 'day-event-more fit-hidden';
      container.appendChild(more);
    });
    fitPills();
    window.addEventListener('resize', () => { clearTimeout(fitPills.t); fitPills.t = setTimeout(fitPills, 80); });
    document.getElementById('timerToggle').addEventListener('change', fitPills);
  })();

  function fitPills() {
    document.querySelectorAll('.day-events').forEach(box => {
      const more = box.querySelector('.day-event-more');
      if (!more) return;
      const hideTimers = document.body.classList.contains('hide-timers');
      const pills = [...box.children].filter(el => el !== more && !(hideTimers && el.classList.contains('day-timer-pill')));
      pills.forEach(p => p.classList.remove('fit-hidden'));
      more.classList.add('fit-hidden');
      const room = box.clientHeight;
      const overflow = () => box.scrollHeight > room + 1;
      if (!overflow()) return;
      more.classList.remove('fit-hidden');
      let hidden = 0;
      for (let i = pills.length - 1; i >= 0 && overflow(); i--) {
        pills[i].classList.add('fit-hidden');
        hidden++;
        more.textContent = '+' + hidden + '개 더';
      }
      more.textContent = '+' + hidden + '개 더';
    });
  }

  let selectedDate = null;

  function selectDay(el) {
    document.querySelectorAll('.cal-day.selected').forEach(d => d.classList.remove('selected'));
    el.classList.add('selected');
    selectedDate = el.getAttribute('data-date');
    renderDayPanel(selectedDate);
  }

  function renderDayPanel(dateStr) {
    const [y, m, d] = dateStr.split('-').map(Number);
    const dow = ['일','월','화','수','목','금','토'][new Date(y, m-1, d).getDay()];
    const label = y + '년 ' + m + '월 ' + d + '일 (' + dow + ')';
    const events = eventsMap[dateStr] || [];
    const timers = timersMap[dateStr] || [];

    let eventsHtml = events.length === 0
      ? '<div class="day-panel-empty">등록된 일정이 없어요</div>'
      : events.map(ev => `
          <div class="event-item" id="ev-${ev.id}">
            ${ev.title ? `<div class="event-item-title">${escHtml(ev.title)}</div>` : ''}
            <div class="event-item-content">${escHtml(ev.content || '')}</div>
            <div class="event-item-actions">
              <a class="btn-ev btn-ev-edit" onclick="showEditForm('${ev.id}','${escJs(ev.title)}','${escJs(ev.content)}','${dateStr}')">수정</a>
              <form action="/calendar/${ev.id}/delete" method="post" style="display:inline;">
                <input type="hidden" name="year"  value="${CUR_YEAR}">
                <input type="hidden" name="month" value="${CUR_MONTH}">
                <a class="btn-ev btn-ev-del" onclick="if(confirm('삭제하시겠습니까?')) this.closest('form').submit()">삭제</a>
              </form>
            </div>
          </div>`).join('');

    const timersHtml = timers.length === 0 ? '' : `
      <div class="timer-section">
        <div class="timer-section-title">⏰ 파이프라인 타이머 ${timers.length}건</div>
        ${timers.map(t => `
          <div class="timer-item ${t.kind}">
            <div class="timer-top">
              <span class="timer-time">${escHtml(timerText(t))}</span>
              <span class="timer-badge">${TIMER_LABEL[t.kind] || t.kind}${t.trigger === 'now' ? ' · 지금 실행' : ''}</span>
            </div>
            <div class="timer-name"><a href="/pipelines/${encodeURIComponent(t.pipelineId)}">${escHtml(t.pipelineName)}</a> · ${escHtml(t.nodeName)}</div>
            ${t.description ? `<div class="timer-sub">${escHtml(t.description)}${t.count ? ' · 이날 ' + t.count + '회' : ''}</div>` : ''}
            ${t.message && t.kind !== 'fired' ? `<div class="timer-msg">${escHtml(t.message)}</div>` : ''}
          </div>`).join('')}
      </div>`;

    const addForm = `
      <div class="add-form-wrap">
        <div class="add-form-label">+ 일정 추가</div>
        <form class="add-form" action="/calendar" method="post">
          <input type="hidden" name="date"  value="${dateStr}">
          <input type="hidden" name="year"  value="${CUR_YEAR}">
          <input type="hidden" name="month" value="${CUR_MONTH}">
          <input type="text" name="title" placeholder="제목 (선택)"/>
          <textarea name="content" placeholder="내용을 입력하세요" required></textarea>
          <a class="btn-add-submit" onclick="this.closest('form').submit()">저장</a>
        </form>
      </div>`;

    document.getElementById('dayPanel').innerHTML = `
      <div class="day-panel-header">
        <div class="day-panel-date">${label}</div>
        <div class="day-panel-sub">${events.length}개의 일정${timers.length ? ' · 타이머 ' + timers.length + '건' : ''}</div>
      </div>
      <div class="day-events-list">${eventsHtml}${timersHtml}</div>
      ${addForm}`;
  }

  function showEditForm(id, title, content, dateStr) {
    const item = document.getElementById('ev-' + id);
    item.innerHTML = `
      <form class="edit-form" action="/calendar/${id}/edit" method="post">
        <input type="hidden" name="date"  value="${dateStr}">
        <input type="hidden" name="year"  value="${CUR_YEAR}">
        <input type="hidden" name="month" value="${CUR_MONTH}">
        <input type="text" name="title" value="${escAttr(title)}" placeholder="제목 (선택)"/>
        <textarea name="content" required>${escHtml(content)}</textarea>
        <div class="edit-form-actions">
          <a class="btn btn-primary" style="height:28px;padding:0 12px;font-size:12px;" onclick="this.closest('form').submit()">저장</a>
          <a class="btn btn-ghost" style="height:28px;padding:0 12px;font-size:12px;" onclick="renderDayPanel('${dateStr}')">취소</a>
        </div>
      </form>`;
  }

  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function escJs(s) {
    return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\n/g,'\\n');
  }
  function escAttr(s) {
    return String(s).replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }
</script>
