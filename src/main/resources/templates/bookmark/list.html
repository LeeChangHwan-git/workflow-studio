<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout :: head('북마크')"></head>
<style>
    .bk-card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 14px 18px;
        margin-bottom: 8px;
        transition: border-color .15s, background .15s;
        text-decoration: none;
    }
    .bk-card:hover { border-color: #606060; background: var(--bg-3); }
    .bk-favicon {
        width: 38px; height: 38px;
        border-radius: var(--radius);
        background: linear-gradient(135deg, #0E639C, #0D7377);
        display: flex; align-items: center; justify-content: center;
        font-size: 16px; color: #fff; font-weight: 800;
        flex-shrink: 0;
    }
    .bk-info { flex: 1; min-width: 0; }
    .bk-name {
        font-size: 14px; font-weight: 700; color: var(--text);
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .bk-url {
        font-size: 12px; color: var(--dim); margin-top: 2px;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .bk-desc {
        font-size: 12px; color: var(--muted); margin-top: 3px;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .bk-right { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
    .bk-badge {
        padding: 2px 9px;
        background: #1E3A5F; color: #4FC1FF;
        border-radius: 3px; font-size: 11px; font-weight: 700;
    }
    .btn-sm {
        display: inline-flex; align-items: center;
        height: 28px; padding: 0 10px;
        border-radius: var(--radius); font-size: 12px; font-weight: 600;
        text-decoration: none; cursor: pointer;
        border: 1px solid transparent; transition: all .15s;
        color: #D4D4D4 !important;
    }
    .btn-open   { background: #1B3D35; color: #4EC9B0 !important; border-color: #2D5A4A; }
    .btn-open:hover { background: #244F44; color: #4EC9B0 !important; }
    .btn-edit   { background: #1E3A5F; color: #4FC1FF !important; border-color: #264F78; }
    .btn-edit:hover { background: #264F78; color: #4FC1FF !important; }
    .btn-del    { background: #3A1E1E; color: #F48771 !important; border-color: #5A2D2D; }
    .btn-del:hover  { background: #5A2D2D; color: #F48771 !important; }
</style>
<body>
<nav th:replace="~{fragments/nav :: nav('bookmarks')}"></nav>

<div class="container">
    <div class="page-header">
        <div>
            <div class="page-title">북마크</div>
            <div class="page-sub" th:text="${bookmarks.size()} + '개의 링크'"></div>
        </div>
        <a th:href="@{/bookmarks/new}" class="btn btn-primary btn-lg">＋ 새 북마크</a>
    </div>

    <div class="search-wrap">
        <form method="get" th:action="@{/bookmarks}" style="display:flex;gap:8px;flex:1;">
            <input class="search-input" type="text" name="search"
                   placeholder="이름, URL, 설명으로 검색..." th:value="${search}"/>
            <a class="btn btn-primary" onclick="this.closest('form').submit()">검색</a>
            <a th:href="@{/bookmarks}" class="btn btn-ghost">전체</a>
        </form>
    </div>

    <div th:if="${bookmarks.isEmpty()}" class="empty-state">
        <div class="empty-icon">🔖</div>
        <div class="empty-text">저장된 북마크가 없습니다.<br>즐겨찾는 사이트를 추가해보세요.</div>
    </div>

    <div th:if="${!bookmarks.isEmpty()}">
        <div class="bk-card" th:each="bk : ${bookmarks}">
            <div class="bk-favicon"
                 th:text="${#strings.substring(bk.name,0,1).toUpperCase()}"></div>
            <div class="bk-info">
                <div class="bk-name" th:text="${bk.name}"></div>
                <div class="bk-url" th:text="${bk.url}"></div>
                <div class="bk-desc" th:if="${bk.description != null and !bk.description.isEmpty()}"
                     th:text="${bk.description}"></div>
            </div>
            <div class="bk-right">
                <span class="bk-badge"
                      th:if="${bk.category != null and !bk.category.isEmpty()}"
                      th:text="${bk.category}"></span>
                <a th:href="@{/bookmarks/{id}/open(id=${bk.id})}" class="btn-sm btn-open">↗ 열기</a>
                <a th:href="@{/bookmarks/{id}/edit(id=${bk.id})}" class="btn-sm btn-edit">✏ 수정</a>
                <form th:action="@{/bookmarks/{id}/delete(id=${bk.id})}" method="post"
                      style="display:inline;">
                    <a class="btn-sm btn-del" onclick="if(confirm('삭제하시겠습니까?')) this.closest('form').submit()">🗑</a>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
