<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout :: head('파이프라인 편집')"></head>
<style>
/* ── 에디터 전체 레이아웃 ── */
body { overflow: hidden; }
.editor-wrap {
    display: flex;
    height: calc(100vh - 56px);
}

/* ── 왼쪽 팔레트 ── */
.palette {
    width: 190px;
    min-width: 190px;
    background: #252526;
    border-right: 1px solid #3E3E42;
    display: flex;
    flex-direction: column;
    padding: 12px 8px;
    gap: 3px;
    overflow-y: auto;
}
.palette-title {
    font-size: 10px; font-weight: 700; color: #6A6A6A;
    text-transform: uppercase; letter-spacing: .7px;
    padding: 0 6px;
    margin-bottom: 6px;
}
.palette-item {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 9px;
    border-radius: 4px;
    cursor: grab;
    font-size: 12px;
    color: #CCCCCC;
    font-weight: 500;
    border: 1px solid transparent;
    transition: all .12s;
    user-select: none;
}
.palette-item:hover {
    background: #2D2D30;
    border-color: #454545;
    color: #D4D4D4;
}
.palette-item:active { cursor: grabbing; }
.palette-dot {
    width: 9px; height: 9px;
    border-radius: 50%;
    flex-shrink: 0;
}

/* ── 중앙 캔버스 ── */
.canvas-wrap {
    flex: 1;
    position: relative;
    background:
        radial-gradient(circle, #3A3A3A 1px, transparent 1px),
        #1E1E1E;
    background-size: 24px 24px;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
}
.canvas-wrap.drag-over {
    outline: 2px dashed #0E639C;
    outline-offset: -2px;
    background:
        radial-gradient(circle, #264F78 1px, transparent 1px),
        #1A2633;
    background-size: 24px 24px;
}
#canvasArea {
    position: absolute;
    inset: 0;
    overflow: hidden;
}
#svgLayer {
    position: absolute;
    inset: 0;
    /* 연결선 클릭은 허용, 나머지는 노드 레이어로 통과 */
    pointer-events: none;
    overflow: visible;
}
#svgLayer path.conn-path {
    pointer-events: stroke;
}
#nodesLayer {
    position: absolute;
    inset: 0;
    -webkit-user-select: none;
    user-select: none;
}

/* ── 노드 ── */
.pnode {
    position: absolute;
    min-width: 160px;
    background: #2D2D30;
    border-radius: 6px;
    box-shadow: 0 2px 8px rgba(0,0,0,.5);
    border: 1px solid #454545;
    cursor: pointer;
    user-select: none;
    transition: box-shadow .15s, border-color .15s;
    z-index: 10;
    overflow: visible;
}
.pnode:hover { border-color: #606060; box-shadow: 0 4px 16px rgba(0,0,0,.6); }
.pnode.selected { border-color: #0E639C; box-shadow: 0 0 0 2px rgba(14,99,156,.4); }

.pnode-header {
    display: flex; align-items: center; gap: 8px;
    padding: 9px 11px;
}
.pnode-icon { font-size: 16px; }
.pnode-label { font-size: 12px; font-weight: 700; color: #D4D4D4; flex: 1; }
.pnode-del {
    background: none; border: none; cursor: pointer;
    font-size: 13px; color: #555; padding: 0 2px;
    line-height: 1; transition: color .15s;
}
.pnode-del:hover { color: #F14C4C; }

/* ── 포트 ── */
.pnode-port {
    position: absolute;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: #454545;
    border: 2px solid #2D2D30;
    box-shadow: 0 0 0 1px #606060;
    transition: background .15s, box-shadow .15s, transform .15s;
    z-index: 20;
    top: 50%;
    transform: translateY(-50%);
}
.pnode-port.port-in  { left: -9px; cursor: default; }
.pnode-port.port-out {
    right: -9px; cursor: grab;
    background: #264F78;
    box-shadow: 0 0 0 1px #4FC1FF;
}
.pnode-port.port-out:hover {
    background: #0E639C;
    box-shadow: 0 0 0 4px rgba(14,99,156,.35);
    transform: translateY(-50%) scale(1.3);
}
.pnode-port.port-out:active { cursor: grabbing; }
.pnode-port.port-in.connectable {
    background: #1B3D35;
    box-shadow: 0 0 0 3px rgba(78,201,176,.35);
    cursor: crosshair;
    transform: translateY(-50%) scale(1.25);
}
.pnode-port.port-in.hover-target {
    background: #4EC9B0;
    box-shadow: 0 0 0 5px rgba(78,201,176,.4);
    transform: translateY(-50%) scale(1.4);
    cursor: crosshair;
}
.pnode-port.active {
    background: #0E639C;
    box-shadow: 0 0 0 4px rgba(14,99,156,.4);
    transform: translateY(-50%) scale(1.2);
}

/* ── 연결선 ── */
.conn-path {
    fill: none;
    stroke: #555;
    stroke-width: 1.5;
    marker-end: url(#arrow);
    transition: stroke .15s;
    pointer-events: stroke;
    cursor: pointer;
}
.conn-path:hover { stroke: #F14C4C; }
.conn-path-preview {
    fill: none;
    stroke: #4FC1FF;
    stroke-width: 1.5;
    stroke-dasharray: 5 4;
    pointer-events: none;
}

/* ── 오른쪽 패널 ── */
.config-panel {
    width: 270px;
    min-width: 270px;
    background: #252526;
    border-left: 1px solid #3E3E42;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}
.config-header {
    padding: 13px 16px 11px;
    border-bottom: 1px solid #3E3E42;
    font-size: 13px; font-weight: 700; color: #D4D4D4;
}
.config-body { flex: 1; overflow-y: auto; padding: 12px 14px; }
.config-empty {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; height: 100%;
    color: #4A4A4A; font-size: 13px; gap: 10px;
}
.config-empty-icon { font-size: 32px; opacity: .4; }
.cfg-group { margin-bottom: 12px; }
.cfg-label {
    display: block;
    font-size: 10px; font-weight: 700; color: #6A6A6A;
    margin-bottom: 5px;
    text-transform: uppercase; letter-spacing: .4px;
}
.cfg-input, .cfg-select, .cfg-textarea {
    width: 100%;
    padding: 7px 9px;
    border: 1px solid #454545;
    border-radius: 4px;
    font-size: 12px;
    font-family: inherit;
    color: #D4D4D4;
    background: #3C3C3C;
    outline: none;
    transition: border-color .15s;
}
.cfg-input:focus, .cfg-select:focus, .cfg-textarea:focus {
    border-color: #0E639C;
    box-shadow: 0 0 0 2px rgba(14,99,156,.25);
}
.cfg-input::placeholder, .cfg-textarea::placeholder { color: #555; }
.cfg-select option { background: #3C3C3C; color: #D4D4D4; }
.cfg-textarea { min-height: 80px; resize: vertical; line-height: 1.6; }
.cfg-img-wrap { display: flex; flex-direction: column; gap: 6px; }
.cfg-img-preview {
    width: 100%; max-height: 100px;
    object-fit: contain;
    border: 1px solid #454545;
    border-radius: 4px;
    background: #1E1E1E;
    display: none;
}
.cfg-img-preview.visible { display: block; }
.cfg-upload-btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 11px;
    background: #1E3A5F; border: 1px solid #264F78;
    border-radius: 4px;
    font-size: 11px; font-weight: 700; color: #4FC1FF;
    cursor: pointer; transition: all .15s;
}
.cfg-upload-btn:hover { background: #264F78; }
.cfg-upload-input { display: none; }
.cfg-img-btns { display: flex; gap: 6px; }
.cfg-img-btns .cfg-upload-btn { flex: 1; justify-content: center; }
.cfg-capture-btn {
    flex: 1;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    padding: 6px 11px;
    background: #1B3D35; border: 1px solid #2D5A4A;
    border-radius: 4px;
    font-size: 11px; font-weight: 700; color: #4EC9B0;
    cursor: pointer; transition: all .15s;
}
.cfg-capture-btn:hover { background: #244F44; }
.cfg-capture-btn:disabled { opacity: .5; cursor: default; }

/* ── 하단 툴바 ── */
.editor-toolbar {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 6px;
    background: #2D2D30;
    border: 1px solid #454545;
    border-radius: 8px;
    padding: 8px 12px;
    box-shadow: 0 8px 32px rgba(0,0,0,.6);
    z-index: 100;
}
.pipeline-name-input {
    height: 34px;
    padding: 0 12px;
    border: 1px solid #454545;
    border-radius: 4px;
    font-size: 13px; font-weight: 600;
    min-width: 200px;
    outline: none;
    background: #3C3C3C;
    color: #D4D4D4;
    transition: border-color .15s;
}
.pipeline-name-input:focus { border-color: #0E639C; }
.pipeline-name-input::placeholder { color: #555; }
.pipeline-desc-input {
    height: 34px;
    padding: 0 11px;
    border: 1px solid #454545;
    border-radius: 4px;
    font-size: 12px;
    min-width: 150px;
    outline: none;
    background: #3C3C3C;
    color: #9E9E9E;
    transition: border-color .15s;
}
.pipeline-desc-input:focus { border-color: #0E639C; }
.pipeline-desc-input::placeholder { color: #555; }

/* ── 실행 모달 ── */
.modal-backdrop {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,.7); z-index: 999;
    align-items: center; justify-content: center;
}
.modal-backdrop.show { display: flex; }
.modal-box {
    background: #252526;
    border: 1px solid #454545;
    border-radius: 6px;
    width: 560px; max-height: 75vh;
    display: flex; flex-direction: column;
    box-shadow: 0 24px 64px rgba(0,0,0,.7);
    overflow: hidden;
}
.modal-header {
    padding: 16px 20px 13px;
    border-bottom: 1px solid #3E3E42;
    display: flex; align-items: center; gap: 10px;
}
.modal-title { font-size: 14px; font-weight: 700; flex: 1; color: #D4D4D4; }
.modal-close {
    background: none; border: none; cursor: pointer;
    font-size: 16px; color: #666; padding: 4px;
    border-radius: 4px; transition: color .15s;
}
.modal-close:hover { color: #F14C4C; }
.modal-body { flex: 1; overflow-y: auto; padding: 13px 20px; }
.modal-footer {
    padding: 11px 20px;
    border-top: 1px solid #3E3E42;
    display: flex; gap: 8px; justify-content: flex-end;
}
.log-item {
    display: flex; gap: 10px;
    padding: 8px 11px;
    border-radius: 4px;
    margin-bottom: 5px;
    font-size: 12px;
}
.log-item.running { background: #1E2D3A; border-left: 2px solid #569CD6; }
.log-item.success { background: #1B3D35; border-left: 2px solid #4EC9B0; }
.log-item.error   { background: #3A1E1E; border-left: 2px solid #F14C4C; }
.log-output {
    font-family: 'Consolas', monospace; font-size: 11px;
    color: #CE9178; margin-top: 4px;
    white-space: pre-wrap; word-break: break-all;
    max-height: 80px; overflow-y: auto;
}
.overall-status {
    padding: 8px 11px; border-radius: 4px;
    font-size: 12px; font-weight: 600; margin-bottom: 10px;
    border: 1px solid transparent;
}
.overall-status.running { background: #1E2D3A; color: #569CD6; border-color: #264F78; }
.overall-status.done    { background: #1B3D35; color: #4EC9B0; border-color: #2D5A4A; }
.overall-status.error   { background: #3A1E1E; color: #F48771; border-color: #5A2D2D; }
</style>
<body>
<nav>
    <div class="nav-brand"><div class="nav-brand-icon">🗂</div>내 메모</div>
    <a th:href="@{/memos}"     class="nav-link">메모</a>
    <a th:href="@{/bookmarks}" class="nav-link">북마크</a>
    <a th:href="@{/calendar}"  class="nav-link">달력</a>
    <a th:href="@{/pipelines}" class="nav-link active">파이프라인</a>
    <a th:href="@{/settings}"  class="nav-link">설정</a>
</nav>

<div class="editor-wrap">
    <!-- 왼쪽 팔레트 -->
    <div class="palette">
        <div class="palette-title">드래그하여 추가</div>
        <div class="palette-item"
             th:each="nt : ${nodeTypes}"
             th:data-type="${nt.id()}"
             th:data-icon="${nt.icon()}"
             th:data-label="${nt.label()}"
             th:data-color="${nt.color()}"
             draggable="true"
             ondragstart="onPaletteDragStart(event)">
            <div class="palette-dot" th:style="'background:' + ${nt.color()}"></div>
            <span th:text="${nt.icon()}"></span>
            <span th:text="${nt.label()}"></span>
        </div>
    </div>

    <!-- 중앙 캔버스 -->
    <div class="canvas-wrap" id="canvasWrap"
         ondragover="event.preventDefault(); this.classList.add('drag-over')"
         ondragleave="this.classList.remove('drag-over')"
         ondrop="onCanvasDrop(event)">
        <div id="canvasArea">
            <svg id="svgLayer">
                <defs>
                    <marker id="arrow" markerWidth="8" markerHeight="8"
                            refX="6" refY="3" orient="auto">
                        <path d="M0,0 L0,6 L8,3 z" fill="#555"/>
                    </marker>
                    <marker id="arrowGreen" markerWidth="8" markerHeight="8"
                            refX="6" refY="3" orient="auto">
                        <path d="M0,0 L0,6 L8,3 z" fill="#4EC9B0"/>
                    </marker>
                </defs>
            </svg>
            <div id="nodesLayer"></div>
        </div>
    </div>

    <!-- 오른쪽 설정 패널 -->
    <div class="config-panel">
        <div class="config-header" id="configHeader">노드 설정</div>
        <div class="config-body" id="configBody">
            <div class="config-empty">
                <div class="config-empty-icon">🖱️</div>
                <div>노드를 클릭하면<br>설정이 표시됩니다</div>
            </div>
        </div>
    </div>
</div>

<!-- 하단 툴바 -->
<div class="editor-toolbar">
    <a th:href="@{/pipelines}" class="btn btn-ghost">← 목록</a>
    <input class="pipeline-name-input" id="pipelineName"
           type="text" placeholder="파이프라인 이름..."
           th:value="${pipeline.name != null ? pipeline.name : ''}">
    <input class="pipeline-desc-input" id="pipelineDesc"
           type="text" placeholder="설명 (선택)"
           th:value="${pipeline.description != null ? pipeline.description : ''}">
    <button class="btn btn-primary" onclick="savePipeline()">💾 저장</button>
    <button class="btn btn-success" onclick="runPipeline()">▶ 실행</button>
    <button class="btn btn-ghost" onclick="clearCanvas()">🗑 전체삭제</button>
</div>

<!-- 실행 모달 -->
<div class="modal-backdrop" id="runModal">
    <div class="modal-box">
        <div class="modal-header">
            <span>⚡</span>
            <div class="modal-title">파이프라인 실행</div>
            <button class="modal-close" onclick="closeRunModal()">✕</button>
        </div>
        <div class="modal-body">
            <div class="overall-status running" id="overallStatus">⏳ 실행 중...</div>
            <div id="logContainer"></div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-ghost" id="cancelBtn" onclick="cancelRun()">중단</button>
            <button class="btn btn-primary" id="closeBtn" style="display:none" onclick="closeRunModal()">닫기</button>
        </div>
    </div>
</div>

<script th:inline="javascript">
// ── 서버 데이터 ─────────────────────────────────────────────────
const PIPELINE_ID    = /*[[${pipeline.id}]]*/ null;
const IS_NEW         = /*[[${isNew}]]*/ true;
const INIT_NODES     = /*[[${pipeline.nodes}]]*/ [];
const INIT_CONNS     = /*[[${pipeline.connections}]]*/ [];
const NODE_TYPES_RAW = /*[[${nodeTypes}]]*/ [];

// nodeTypeId → nodeTypeInfo map
const NT = {};
NODE_TYPES_RAW.forEach(t => NT[t.id] = t);

// ── 에디터 상태 ──────────────────────────────────────────────────
let nodeCounter   = 0;
const nodes       = {};   // nodeId → {id, type, el, portIn, portOut, config}
const connections = [];   // [{id, from, to, el}]
let selectedId    = null;
let connectingFrom = null; // 연결 시작 노드 ID
let previewPath   = null;
let pipelineId    = PIPELINE_ID;

const nodesLayer = document.getElementById('nodesLayer');
const svgLayer   = document.getElementById('svgLayer');
const canvasWrap = document.getElementById('canvasWrap');

// ── 노드 추가 ────────────────────────────────────────────────────
function addNode(type, x, y, config) {
    const id  = 'n' + (++nodeCounter);
    const nt  = NT[type];
    if (!nt) return null;

    const el = document.createElement('div');
    el.className = 'pnode';
    el.dataset.id = id;
    el.style.left = x + 'px';
    el.style.top  = y + 'px';
    el.innerHTML = `
        <div class="pnode-port port-in"  data-node="${id}" data-port="in"  title="입력 포트"></div>
        <div class="pnode-header">
            <span class="pnode-icon">${nt.icon}</span>
            <span class="pnode-label">${nt.label}</span>
            <button class="pnode-del" onclick="removeNode('${id}',event)">✕</button>
        </div>
        <div class="pnode-port port-out" data-node="${id}" data-port="out" title="드래그하여 연결"></div>`;
    el.style.borderColor = nt.color;

    nodesLayer.appendChild(el);

    const portIn  = el.querySelector('.port-in');
    const portOut = el.querySelector('.port-out');

    // 노드 드래그
    makeDraggable(el, id);

    // 노드 클릭 → 선택 (포트·삭제 버튼 제외)
    el.addEventListener('mousedown', e => {
        if (e.target.classList.contains('pnode-port') || e.target.classList.contains('pnode-del')) return;
        e.stopPropagation();
        selectNode(id);
    });

    // 출력 포트 mousedown → 연결 드래그 시작
    // e.preventDefault() 로 텍스트 선택 완전 차단
    portOut.addEventListener('mousedown', e => {
        e.stopPropagation();
        e.preventDefault();
        startConnect(id);
    });

    nodes[id] = { id, type, el, portIn, portOut, config: config || buildDefaultConfig(type) };
    return id;
}

function buildDefaultConfig(type) {
    const nt = NT[type];
    if (!nt || !nt.params) return {};
    const cfg = {};
    nt.params.forEach(p => { cfg[p.name] = p.defaultValue || ''; });
    return cfg;
}

function removeNode(id, event) {
    event.stopPropagation();
    if (!nodes[id]) return;
    nodes[id].el.remove();
    // 연결선 삭제
    for (let i = connections.length - 1; i >= 0; i--) {
        const c = connections[i];
        if (c.from === id || c.to === id) {
            c.el.remove();
            connections.splice(i, 1);
        }
    }
    delete nodes[id];
    if (selectedId === id) { selectedId = null; renderConfigPanel(null); }
    redrawConnections();
}

// ── 노드 선택 ────────────────────────────────────────────────────
function selectNode(id) {
    if (selectedId && nodes[selectedId]) {
        nodes[selectedId].el.classList.remove('selected');
    }
    selectedId = id;
    if (id && nodes[id]) {
        nodes[id].el.classList.add('selected');
        renderConfigPanel(id);
    }
}

// 캔버스 빈 곳 클릭 → 선택 해제
canvasWrap.addEventListener('mousedown', e => {
    if (e.target === canvasWrap || e.target.id === 'canvasArea'
        || e.target.id === 'nodesLayer' || e.target.id === 'svgLayer') {
        selectNode(null);
    }
});

// ── 연결 ─────────────────────────────────────────────────────────
function startConnect(fromId) {
    connectingFrom = fromId;
    nodes[fromId].portOut.classList.add('active');

    // 미리보기 선 (SVG)
    previewPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    previewPath.className.baseVal = 'conn-path-preview';
    svgLayer.appendChild(previewPath);

    canvasWrap.style.cursor = 'crosshair';

    // 연결 가능한 입력 포트 모두 초록으로 강조
    document.querySelectorAll('.port-in').forEach(p => {
        if (p.dataset.node !== fromId) p.classList.add('connectable');
    });
}

// ── mousemove: 프리뷰 선 업데이트 ────────────────────────────────
document.addEventListener('mousemove', e => {
    if (!connectingFrom || !previewPath) return;
    const fromPort = nodes[connectingFrom].portOut;
    const fr = fromPort.getBoundingClientRect();
    const wr = canvasWrap.getBoundingClientRect();
    const x1 = fr.left - wr.left + fr.width  / 2;
    const y1 = fr.top  - wr.top  + fr.height / 2;
    const x2 = e.clientX - wr.left;
    const y2 = e.clientY - wr.top;
    previewPath.setAttribute('d', bezier(x1, y1, x2, y2));

    // 현재 마우스 아래 port-in 이 있으면 강조
    const underEl = document.elementFromPoint(e.clientX, e.clientY);
    const overPort = underEl?.closest('.port-in');
    document.querySelectorAll('.port-in.hover-target').forEach(p => p.classList.remove('hover-target'));
    if (overPort && overPort.dataset.node !== connectingFrom) {
        overPort.classList.add('hover-target');
    }
});

// ── mouseup: elementFromPoint 로 연결 대상 판정 ─────────────────
// canvasWrap.mouseup 대신 document.mouseup 를 사용해야
// 포트 위에서 마우스를 떼는 경우를 정확히 잡을 수 있음
document.addEventListener('mouseup', e => {
    if (!connectingFrom) return;

    const underEl = document.elementFromPoint(e.clientX, e.clientY);
    const targetPort = underEl?.closest('.port-in');
    const targetNodeId = targetPort?.dataset.node;

    if (targetNodeId && targetNodeId !== connectingFrom) {
        finishConnect(targetNodeId);
    } else {
        cancelConnect();
    }
});

function finishConnect(toId) {
    const fromId = connectingFrom;
    cancelConnect();
    if (!fromId || fromId === toId) return;
    if (connections.some(c => c.from === fromId && c.to === toId)) return;
    addConnection(fromId, toId);
}

function cancelConnect() {
    if (connectingFrom && nodes[connectingFrom]) {
        nodes[connectingFrom].portOut.classList.remove('active');
    }
    if (previewPath) { previewPath.remove(); previewPath = null; }
    // connectable / hover-target 강조 해제
    document.querySelectorAll('.port-in.connectable').forEach(p => p.classList.remove('connectable'));
    document.querySelectorAll('.port-in.hover-target').forEach(p => p.classList.remove('hover-target'));
    connectingFrom = null;
    canvasWrap.style.cursor = '';
}

// ── 드래그 중 텍스트 선택 전역 차단 ─────────────────────────────
document.addEventListener('selectstart', e => {
    if (connectingFrom) e.preventDefault();
});

function addConnection(fromId, toId) {
    const connId = 'c_' + fromId + '_' + toId;
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.className.baseVal = 'conn-path';
    path.setAttribute('data-conn', connId);
    path.addEventListener('click', () => {
        if (confirm('이 연결을 삭제하시겠습니까?')) removeConnection(connId);
    });
    svgLayer.appendChild(path);
    connections.push({ id: connId, from: fromId, to: toId, el: path });
    redrawConnections();
}

function removeConnection(connId) {
    const idx = connections.findIndex(c => c.id === connId);
    if (idx === -1) return;
    connections[idx].el.remove();
    connections.splice(idx, 1);
}

function redrawConnections() {
    const wr = canvasWrap.getBoundingClientRect();
    connections.forEach(c => {
        const fromNode = nodes[c.from];
        const toNode   = nodes[c.to];
        if (!fromNode || !toNode) return;
        const fr = fromNode.portOut.getBoundingClientRect();
        const tr = toNode.portIn.getBoundingClientRect();
        const x1 = fr.left - wr.left + fr.width  / 2;
        const y1 = fr.top  - wr.top  + fr.height / 2;
        const x2 = tr.left - wr.left + tr.width  / 2;
        const y2 = tr.top  - wr.top  + tr.height / 2;
        c.el.setAttribute('d', bezier(x1, y1, x2, y2));
    });
}

function bezier(x1, y1, x2, y2) {
    const cx = (x1 + x2) / 2;
    return `M ${x1} ${y1} C ${cx} ${y1}, ${cx} ${y2}, ${x2} ${y2}`;
}

// 노드 이동할 때 연결선 갱신
const resizeObs = new ResizeObserver(redrawConnections);
resizeObs.observe(nodesLayer);

// ── 노드 드래그 (이동) ───────────────────────────────────────────
function makeDraggable(el, id) {
    let startX, startY, startLeft, startTop, dragging = false;

    el.addEventListener('mousedown', e => {
        if (e.target.classList.contains('pnode-port') || e.target.classList.contains('pnode-del')) return;
        dragging = true;
        startX = e.clientX;
        startY = e.clientY;
        startLeft = parseInt(el.style.left) || 0;
        startTop  = parseInt(el.style.top)  || 0;
        el.style.zIndex = 50;
        e.preventDefault();
    });

    document.addEventListener('mousemove', e => {
        if (!dragging) return;
        el.style.left = (startLeft + e.clientX - startX) + 'px';
        el.style.top  = (startTop  + e.clientY - startY) + 'px';
        nodes[id].el = el;
        redrawConnections();
    });

    document.addEventListener('mouseup', () => {
        if (dragging) { dragging = false; el.style.zIndex = ''; }
    });
}

// ── 팔레트 드래그 앤 드롭 ────────────────────────────────────────
let dragType = null;
function onPaletteDragStart(e) {
    dragType = e.currentTarget.dataset.type;
}
function onCanvasDrop(e) {
    e.preventDefault();
    canvasWrap.classList.remove('drag-over');
    if (!dragType) return;
    const wr = canvasWrap.getBoundingClientRect();
    const x = e.clientX - wr.left - 80;
    const y = e.clientY - wr.top  - 30;
    const id = addNode(dragType, Math.max(0, x), Math.max(0, y), null);
    if (id) selectNode(id);
    dragType = null;
}

// ── 설정 패널 렌더링 ─────────────────────────────────────────────
function renderConfigPanel(id) {
    const header = document.getElementById('configHeader');
    const body   = document.getElementById('configBody');

    if (!id || !nodes[id]) {
        header.textContent = '노드 설정';
        body.innerHTML = `<div class="config-empty">
            <div class="config-empty-icon">🖱️</div>
            <div>노드를 클릭하면<br>설정이 표시됩니다</div></div>`;
        return;
    }

    const node = nodes[id];
    const nt   = NT[node.type];
    if (!nt) return;

    header.innerHTML = nt.icon + ' ' + nt.label;

    let html = '';
    (nt.params || []).forEach(p => {
        const val = node.config[p.name] != null ? node.config[p.name] : (p.defaultValue || '');
        html += `<div class="cfg-group"><label class="cfg-label">${p.label}</label>`;
        if (p.type === 'select') {
            html += `<select class="cfg-select" onchange="updateConfig('${id}','${p.name}',this.value)">`;
            (p.options || []).forEach(opt => {
                html += `<option value="${escAttr(opt)}" ${opt == val ? 'selected' : ''}>${escHtml(opt)}</option>`;
            });
            html += `</select>`;
        } else if (p.type === 'textarea') {
            html += `<textarea class="cfg-textarea"
                onchange="updateConfig('${id}','${p.name}',this.value)">${escHtml(String(val))}</textarea>`;
        } else if (p.type === 'number') {
            html += `<input class="cfg-input" type="number" value="${escAttr(String(val))}"
                onchange="updateConfig('${id}','${p.name}',this.value)">`;
        } else if (p.type === 'image') {
            const hasImg = val && String(val).trim();
            html += `<div class="cfg-img-wrap">
                <img id="img-${id}-${p.name}" class="cfg-img-preview ${hasImg ? 'visible' : ''}"
                     src="${hasImg ? '/api/' + val : ''}">
                <div class="cfg-img-btns">
                    <label class="cfg-upload-btn">
                        📁 이미지 업로드
                        <input type="file" accept="image/*" class="cfg-upload-input"
                            onchange="uploadNodeImage('${id}','${p.name}',this)">
                    </label>
                    <button type="button" class="cfg-capture-btn"
                        onclick="captureNodeImage('${id}','${p.name}',this)">
                        📷 화면 캡처
                    </button>
                </div>
            </div>`;
        } else {
            html += `<input class="cfg-input" type="text" value="${escAttr(String(val))}"
                oninput="updateConfig('${id}','${p.name}',this.value)">`;
        }
        html += '</div>';
    });

    // ${nodeId.output} 참조 힌트
    html += `<div style="margin-top:12px;padding:8px 10px;background:#1E2D3A;
        border:1px solid #264F78;border-radius:4px;font-size:11px;color:#9CDCFE;line-height:1.7;">
        💡 <b>변수 참조:</b><br>
        이전 노드 출력 참조: <code style="color:#CE9178">\${nodeId.output}</code><br>
        outputVar 설정 시: <code style="color:#CE9178">\${변수명}</code>
    </div>`;

    body.innerHTML = html;
}

function updateConfig(id, key, value) {
    if (!nodes[id]) return;
    nodes[id].config[key] = value;
}

async function uploadNodeImage(nodeId, paramName, input) {
    if (!input.files[0]) return;
    const fd = new FormData();
    fd.append('file', input.files[0]);
    try {
        const r = await fetch('/api/images', { method: 'POST', body: fd });
        const data = await r.json();
        if (data.imagePath) {
            updateConfig(nodeId, paramName, data.imagePath);
            const preview = document.getElementById('img-' + nodeId + '-' + paramName);
            if (preview) {
                preview.src = '/api/' + data.imagePath;
                preview.classList.add('visible');
            }
        }
    } catch(e) { alert('이미지 업로드 실패: ' + e.message); }
}

async function captureNodeImage(nodeId, paramName, btn) {
    showToast('🖥️ 잠시 후 화면이 사라지면 캡처할 영역을 드래그하세요 (ESC: 취소)');
    btn.disabled = true;
    const origText = btn.textContent;
    btn.textContent = '캡처 대기 중...';
    try {
        await new Promise(r => setTimeout(r, 700)); // 토스트 읽을 시간 확보
        const r = await fetch('/api/capture', { method: 'POST' });
        const data = await r.json();
        if (data.imagePath) {
            updateConfig(nodeId, paramName, data.imagePath);
            const preview = document.getElementById('img-' + nodeId + '-' + paramName);
            if (preview) {
                preview.src = '/api/' + data.imagePath;
                preview.classList.add('visible');
            }
            showToast('📷 캡처 완료');
        } else if (data.cancelled) {
            showToast('캡처를 취소했습니다');
        } else if (data.error) {
            alert('캡처 실패: ' + data.error);
        }
    } catch(e) { alert('캡처 실패: ' + e.message); }
    finally {
        btn.disabled = false;
        btn.textContent = origText;
    }
}

// ── 저장 ─────────────────────────────────────────────────────────
async function savePipeline() {
    const name = document.getElementById('pipelineName').value.trim();
    if (!name) { alert('파이프라인 이름을 입력하세요.'); return; }

    const payload = {
        name,
        description: document.getElementById('pipelineDesc').value.trim(),
        nodes: Object.values(nodes).map(n => ({
            id: n.id,
            type: n.type,
            posX: parseFloat(n.el.style.left) || 0,
            posY: parseFloat(n.el.style.top)  || 0,
            config: n.config
        })),
        connections: connections.map(c => ({ fromNodeId: c.from, toNodeId: c.to }))
    };

    try {
        let r;
        if (pipelineId) {
            r = await fetch('/api/pipelines/' + pipelineId, {
                method: 'PUT',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });
        } else {
            r = await fetch('/api/pipelines', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });
        }
        if (!r.ok) throw new Error('저장 실패');
        const saved = await r.json();
        pipelineId = saved.id;
        history.replaceState(null, '', '/pipelines/' + pipelineId);
        showToast('💾 저장 완료');
    } catch(e) { alert(e.message); }
}

// ── 실행 ─────────────────────────────────────────────────────────
let currentExecId = null;
let pollTimer = null;

async function runPipeline() {
    // 실행 전 항상 먼저 저장 — 편집기의 현재 상태(노드/연결)로 실행되도록 보장
    await savePipeline();
    if (!pipelineId) return;
    document.getElementById('logContainer').innerHTML = '';
    const os = document.getElementById('overallStatus');
    os.className = 'overall-status running';
    os.textContent = '⏳ 실행 중...';
    document.getElementById('cancelBtn').style.display = '';
    document.getElementById('closeBtn').style.display = 'none';
    document.getElementById('runModal').classList.add('show');

    try {
        const r = await fetch('/api/pipelines/' + pipelineId + '/run', {method: 'POST'});
        const data = await r.json();
        if (data.error) { showRunError(data.error); return; }
        currentExecId = data.executionId;
        pollTimer = setInterval(pollLogs, 800);
    } catch(e) { showRunError(e.message); }
}

async function pollLogs() {
    try {
        const r = await fetch('/api/executions/' + currentExecId);
        const data = await r.json();
        renderRunLogs(data.logs);
        if (data.status !== 'running') {
            clearInterval(pollTimer); pollTimer = null;
            const os = document.getElementById('overallStatus');
            if (data.status === 'done') {
                os.className = 'overall-status done'; os.textContent = '✅ 완료';
            } else {
                os.className = 'overall-status error'; os.textContent = '❌ 오류 발생';
            }
            document.getElementById('cancelBtn').style.display = 'none';
            document.getElementById('closeBtn').style.display = '';
        }
    } catch(e) {}
}

function renderRunLogs(logs) {
    const c = document.getElementById('logContainer');
    c.innerHTML = '';
    (logs || []).forEach(log => {
        const icon = log.status === 'success' ? '✅' : log.status === 'error' ? '❌' : '⏳';
        const d = document.createElement('div');
        d.className = 'log-item ' + log.status;
        d.innerHTML = `<div style="flex-shrink:0">${icon}</div>
            <div>
                <b>${escHtml(log.nodeType || '')}</b> — ${escHtml(log.message || '')}
                ${log.output ? '<div class="log-output">' + escHtml(log.output) + '</div>' : ''}
            </div>`;
        c.appendChild(d);
    });
    c.scrollTop = c.scrollHeight;
}

function showRunError(msg) {
    clearInterval(pollTimer);
    const os = document.getElementById('overallStatus');
    os.className = 'overall-status error';
    os.textContent = '❌ ' + msg;
    document.getElementById('cancelBtn').style.display = 'none';
    document.getElementById('closeBtn').style.display = '';
}

function cancelRun() {
    if (currentExecId) fetch('/api/executions/' + currentExecId + '/cancel', {method:'POST'});
    clearInterval(pollTimer);
    document.getElementById('overallStatus').className = 'overall-status error';
    document.getElementById('overallStatus').textContent = '⛔ 중단됨';
    document.getElementById('cancelBtn').style.display = 'none';
    document.getElementById('closeBtn').style.display = '';
}

function closeRunModal() {
    clearInterval(pollTimer);
    document.getElementById('runModal').classList.remove('show');
}

// ── 기타 ─────────────────────────────────────────────────────────
function clearCanvas() {
    if (!confirm('캔버스의 모든 노드와 연결을 삭제하시겠습니까?')) return;
    Object.keys(nodes).forEach(id => { nodes[id].el.remove(); delete nodes[id]; });
    connections.splice(0);
    svgLayer.querySelectorAll('path').forEach(p => p.remove());
    renderConfigPanel(null);
}

function showToast(msg) {
    const t = document.createElement('div');
    t.textContent = msg;
    t.style.cssText = `position:fixed;bottom:80px;left:50%;transform:translateX(-50%);
        background:#2D2D30;color:#D4D4D4;border:1px solid #454545;
        padding:7px 16px;border-radius:4px;
        font-size:12px;font-weight:600;z-index:9999;opacity:1;transition:opacity .4s`;
    document.body.appendChild(t);
    setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 400); }, 1800);
}

function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function escAttr(s) {
    return String(s).replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// ── 기존 파이프라인 로드 ──────────────────────────────────────────
(function initEditor() {
    // 서버에서 받은 nodes/connections 복원
    const initNodes = INIT_NODES || [];
    const initConns = INIT_CONNS || [];

    initNodes.forEach(n => {
        const id = addNode(n.type, n.posX || 80, n.posY || 80, n.config || {});
        if (id && n.id !== id) {
            // 서버 ID와 생성된 ID를 매핑
            nodes[id]._serverId = n.id;
        }
        if (id) nodes[id]._serverId = n.id;
    });

    // serverId → localId 매핑으로 연결 복원
    const idMap = {};
    Object.values(nodes).forEach(n => {
        if (n._serverId) idMap[n._serverId] = n.id;
    });

    initConns.forEach(c => {
        const from = idMap[c.fromNodeId];
        const to   = idMap[c.toNodeId];
        if (from && to) addConnection(from, to);
    });

    // 약간 지연 후 연결선 재렌더 (DOM 정착 후)
    setTimeout(redrawConnections, 100);
})();
</script>
