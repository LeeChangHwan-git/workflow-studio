<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout :: head('파이프라인')"></head>
<style>
    .pl-card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 16px 20px;
        margin-bottom: 8px;
        display: flex;
        align-items: center;
        gap: 16px;
        transition: border-color .15s, background .15s;
        cursor: pointer;
    }
    .pl-card:hover { border-color: #606060; background: var(--bg-3); }
    .pl-icon {
        width: 44px; height: 44px;
        background: linear-gradient(135deg, #0D7377, #0E639C);
        border-radius: var(--radius);
        display: flex; align-items: center; justify-content: center;
        font-size: 20px; flex-shrink: 0;
    }
    .pl-info { flex: 1; min-width: 0; }
    .pl-name { font-size: 15px; font-weight: 700; color: var(--text); }
    .pl-desc { font-size: 12px; color: var(--muted); margin-top: 3px; }
    .pl-meta { font-size: 11px; color: var(--dim); margin-top: 4px; }
    .pl-actions { display: flex; gap: 6px; flex-shrink: 0; }
    .btn-sm {
        display: inline-flex; align-items: center; gap: 4px;
        height: 30px; padding: 0 11px;
        border-radius: var(--radius); font-size: 12px; font-weight: 600;
        text-decoration: none; cursor: pointer;
        border: 1px solid transparent; transition: all .15s;
        color: #D4D4D4 !important;
    }
    .btn-run    { background: #1B3D35; color: #4EC9B0 !important; border-color: #2D5A4A; }
    .btn-run:hover  { background: #244F44; color: #4EC9B0 !important; }
    .btn-edit   { background: #1E3A5F; color: #4FC1FF !important; border-color: #264F78; }
    .btn-edit:hover { background: #264F78; color: #4FC1FF !important; }
    .btn-export { background: #1E2D3A; color: #9CDCFE !important; border-color: #264050; }
    .btn-export:hover { background: #264050; color: #9CDCFE !important; }
    .btn-del    { background: #3A1E1E; color: #F48771 !important; border-color: #5A2D2D; }
    .btn-del:hover  { background: #5A2D2D; color: #F48771 !important; }
    .import-label {
        display: inline-flex; align-items: center; gap: 6px;
        height: 40px; padding: 0 16px;
        background: var(--bg-3); color: var(--muted);
        border: 1px solid var(--border);
        border-radius: var(--radius); font-size: 13px; font-weight: 600;
        cursor: pointer; transition: all .15s;
    }
    .import-label:hover { border-color: var(--primary-text); color: var(--primary-text); }
    #importFile { display: none; }
</style>
<body>
<nav>
    <div class="nav-brand"><div class="nav-brand-icon">🗂</div>내 메모</div>
    <a th:href="@{/memos}"     class="nav-link">메모</a>
    <a th:href="@{/bookmarks}" class="nav-link">북마크</a>
    <a th:href="@{/calendar}"  class="nav-link">달력</a>
    <a th:href="@{/pipelines}" class="nav-link active">파이프라인</a>
    <a th:href="@{/settings}"  class="nav-link">설정</a>
</nav>

<div class="container">
    <div class="page-header">
        <div>
            <div class="page-title">파이프라인</div>
            <div class="page-sub" th:text="${pipelines.size()} + '개의 자동화'"></div>
        </div>
        <div style="display:flex;gap:10px;align-items:center;">
            <label class="import-label" for="importFile">📥 가져오기
                <input type="file" id="importFile" accept=".zip" onchange="importPipeline(this)">
            </label>
            <a th:href="@{/pipelines/new}" class="btn btn-primary btn-lg">＋ 새 파이프라인</a>
        </div>
    </div>

    <div th:if="${pipelines.isEmpty()}" class="empty-state">
        <div class="empty-icon">⚡</div>
        <div class="empty-text">저장된 파이프라인이 없습니다.<br>새 파이프라인을 만들어 자동화를 시작해보세요.</div>
    </div>

    <div th:if="${!pipelines.isEmpty()}">
        <div class="pl-card" th:each="pl : ${pipelines}"
             th:data-id="${pl.id}"
             onclick="if(!event.target.closest('button,a,form,input')) location.href='/pipelines/'+this.dataset.id">
            <div class="pl-icon">⚡</div>
            <div class="pl-info">
                <div class="pl-name" th:text="${pl.name}"></div>
                <div class="pl-desc" th:if="${pl.description != null and !pl.description.isEmpty()}"
                     th:text="${pl.description}"></div>
                <div class="pl-meta" th:text="${(pl.nodes != null ? pl.nodes.size() : 0) + '개 노드 · ' + (pl.updatedAt != null ? #temporals.format(pl.updatedAt,'yyyy.MM.dd HH:mm') : '')}">
                </div>
            </div>
            <div class="pl-actions">
                <a class="btn-sm btn-run"
                        th:href="${'/pipelines/' + pl.id + '?autorun=true'}">▶ 실행</a>
                <a th:href="@{/pipelines/{id}(id=${pl.id})}" class="btn-sm btn-edit">✏ 편집</a>
                <a th:href="@{/api/pipelines/{id}/export(id=${pl.id})}" class="btn-sm btn-export"
                   target="_blank">📤 내보내기</a>
                <a class="btn-sm btn-del"
                        th:data-id="${pl.id}"
                        onclick="deletePipeline(this.dataset.id, this)">🗑</a>
            </div>
        </div>
    </div>
</div>

<script>
function deletePipeline(id, btn) {
    if (!confirm('이 파이프라인을 삭제하시겠습니까?')) return;
    fetch('/api/pipelines/' + id, {method: 'DELETE'})
        .then(r => { if (r.ok) location.reload(); });
}

function importPipeline(input) {
    if (!input.files[0]) return;
    const fd = new FormData();
    fd.append('file', input.files[0]);
    fetch('/api/pipelines/import', {method: 'POST', body: fd})
        .then(r => { if (r.ok) location.reload(); else alert('가져오기 실패'); });
}
</script>
</body>
</html>
