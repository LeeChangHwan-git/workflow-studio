<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout :: head('HTTP')"></head>
<style>
    .http-wrap { display: flex; height: calc(100vh - 56px); }

    /* ── 히스토리 ── */
    .http-side {
        width: 250px; flex-shrink: 0; background: var(--bg-2);
        border-right: 1px solid #3E3E42; display: flex; flex-direction: column;
    }
    .http-side-head {
        display: flex; align-items: center; justify-content: space-between;
        padding: 12px 14px; font-size: 11px; font-weight: 700; color: var(--dim);
        text-transform: uppercase; letter-spacing: .5px; border-bottom: 1px solid #3E3E42;
    }
    .http-side-clear { background: none; border: none; color: var(--dim); cursor: pointer; font-size: 11px; }
    .http-side-clear:hover { color: var(--danger); }
    .http-hist { flex: 1; overflow-y: auto; }
    .http-hist-item {
        padding: 8px 14px; cursor: pointer; border-bottom: 1px solid #2D2D30; font-size: 12px;
    }
    .http-hist-item:hover { background: var(--bg-3); }
    .http-hist-top { display: flex; align-items: center; gap: 6px; }
    .http-hist-url { color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
    .http-hist-meta { color: var(--dim); font-size: 10px; margin-top: 3px; }
    .http-hist-empty { color: var(--dim); font-size: 12px; padding: 16px 14px; line-height: 1.6; }

    /* ── 메인 ── */
    .http-main { flex: 1; min-width: 0; display: flex; flex-direction: column; padding: 18px 22px; gap: 14px; overflow: hidden; }
    .http-banner {
        background: #1F3D27; border: 1px solid #2E6B3B; color: #7EE2A8;
        border-radius: var(--radius); padding: 8px 12px; font-size: 12px; line-height: 1.6;
    }
    .http-bar { display: flex; gap: 8px; }
    .http-method {
        width: 110px; flex-shrink: 0; font-weight: 700; font-size: 13px;
        background: var(--input-bg); color: var(--text); border: 1px solid var(--border);
        border-radius: var(--radius); padding: 0 10px; height: 40px;
    }
    .http-url {
        flex: 1; height: 40px; padding: 0 12px; font-size: 13px;
        font-family: Consolas, 'D2Coding', monospace;
        background: var(--input-bg); color: var(--text); border: 1px solid var(--border);
        border-radius: var(--radius); outline: none;
    }
    .http-url:focus { border-color: var(--primary); }
    .http-send { height: 40px; padding: 0 22px; }

    .m-GET { color: #4EC9B0; } .m-POST { color: #E2C08D; } .m-PUT { color: #569CD6; }
    .m-PATCH { color: #C586C0; } .m-DELETE { color: #F48771; } .m-HEAD, .m-OPTIONS { color: #9E9E9E; }
    .m-tag { font-size: 10px; font-weight: 800; width: 46px; flex-shrink: 0; }

    .http-panes { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 14px; }
    .http-pane {
        background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
        display: flex; flex-direction: column; min-height: 0;
    }
    .http-pane.req { flex: 0 0 auto; max-height: 45%; }
    .http-pane.res { flex: 1; }
    .http-tabs { display: flex; align-items: center; border-bottom: 1px solid var(--border); padding: 0 8px; flex-shrink: 0; }
    .http-tab {
        background: none; border: none; border-bottom: 2px solid transparent; color: var(--dim);
        font-size: 12px; font-weight: 600; padding: 9px 12px; cursor: pointer;
    }
    .http-tab:hover { color: var(--text); }
    .http-tab.active { color: var(--text); border-bottom-color: var(--primary); }
    .http-tab-count { color: var(--dim); font-weight: 400; margin-left: 3px; }
    .http-tabs-right { margin-left: auto; display: flex; align-items: center; gap: 12px; font-size: 12px; color: var(--muted); }
    .http-body { padding: 12px; overflow: auto; min-height: 0; flex: 1; }
    .hidden { display: none !important; }

    /* 헤더 행 */
    .kv-row { display: flex; gap: 6px; margin-bottom: 6px; align-items: center; }
    .kv-row input[type=text] {
        flex: 1; height: 30px; padding: 0 8px; font-size: 12px; font-family: Consolas, monospace;
        background: var(--input-bg); color: var(--text); border: 1px solid var(--border); border-radius: 4px; outline: none;
    }
    .kv-row input[type=text]:focus { border-color: var(--primary); }
    .kv-del { background: none; border: none; color: var(--dim); cursor: pointer; font-size: 13px; width: 24px; }
    .kv-del:hover { color: var(--danger); }
    .link-btn { background: none; border: none; color: var(--primary-text); cursor: pointer; font-size: 12px; padding: 2px 0; }

    /* 바디 */
    .body-types { display: flex; gap: 14px; margin-bottom: 8px; font-size: 12px; color: var(--muted); align-items: center; }
    .body-types label { display: flex; align-items: center; gap: 4px; cursor: pointer; }
    .body-text {
        width: 100%; min-height: 130px; resize: vertical; padding: 10px;
        font-family: Consolas, 'D2Coding', monospace; font-size: 12px; line-height: 1.6;
        background: #1E1E1E; color: var(--text); border: 1px solid var(--border); border-radius: 4px; outline: none;
    }
    .body-text:focus { border-color: var(--primary); }
    .body-hint { font-size: 11px; color: var(--dim); margin-top: 6px; }

    /* 응답 */
    .status-badge { font-weight: 800; padding: 2px 8px; border-radius: 3px; }
    .s2 { background: #1B3D35; color: #4EC9B0; } .s3 { background: #1E3A5F; color: #4FC1FF; }
    .s4 { background: #3D3420; color: #E2C08D; } .s5, .serr { background: #3A1E1E; color: #F48771; }
    .res-pre {
        margin: 0; font-family: Consolas, 'D2Coding', monospace; font-size: 12px; line-height: 1.6;
        white-space: pre-wrap; word-break: break-all; color: var(--text);
    }
    .res-empty { color: var(--dim); font-size: 13px; text-align: center; padding: 40px 0; line-height: 1.7; }
    .res-headers td { padding: 4px 10px 4px 0; font-size: 12px; font-family: Consolas, monospace; vertical-align: top; }
    .res-headers td:first-child { color: #9CDCFE; white-space: nowrap; }
    .j-key { color: #9CDCFE; } .j-str { color: #CE9178; } .j-num { color: #B5CEA8; } .j-bool { color: #569CD6; } .j-null { color: #808080; }
</style>
<body>
<nav>
    <div class="nav-brand"><div class="nav-brand-icon">🗂</div>내 메모</div>
    <a th:href="@{/memos}"     class="nav-link">메모</a>
    <a th:href="@{/bookmarks}" class="nav-link">북마크</a>
    <a th:href="@{/calendar}"  class="nav-link">달력</a>
    <a th:href="@{/pipelines}" class="nav-link">파이프라인</a>
    <a th:href="@{/http}"      class="nav-link active">HTTP</a>
</nav>

<div class="http-wrap">
    <!-- 히스토리 -->
    <aside class="http-side">
        <div class="http-side-head">
            <span>보낸 요청</span>
            <button type="button" class="http-side-clear" onclick="clearHistory()">전체 삭제</button>
        </div>
        <div class="http-hist" id="hist"></div>
    </aside>

    <main class="http-main">
        <div class="http-banner hidden" id="banner"></div>

        <!-- 요청 줄 -->
        <form class="http-bar" onsubmit="send(); return false;">
            <select class="http-method" id="method" onchange="paintMethod()">
                <option>GET</option><option>POST</option><option>PUT</option>
                <option>PATCH</option><option>DELETE</option><option>HEAD</option><option>OPTIONS</option>
            </select>
            <input class="http-url" id="url" placeholder="https://api.example.com/items  (Ctrl+Enter로 보내기)" autocomplete="off"/>
            <button type="submit" class="btn btn-primary http-send" id="sendBtn">보내기</button>
        </form>

        <div class="http-panes">
            <!-- 요청 -->
            <section class="http-pane req">
                <div class="http-tabs">
                    <button type="button" class="http-tab active" data-tab="body" onclick="reqTab('body')">Body</button>
                    <button type="button" class="http-tab" data-tab="headers" onclick="reqTab('headers')">Headers<span class="http-tab-count" id="hdrCount"></span></button>
                </div>
                <div class="http-body" id="tab-body">
                    <div class="body-types">
                        <label><input type="radio" name="btype" value="none" onchange="bodyType()"> 없음</label>
                        <label><input type="radio" name="btype" value="json" onchange="bodyType()" checked> JSON</label>
                        <label><input type="radio" name="btype" value="text" onchange="bodyType()"> Text</label>
                        <label><input type="radio" name="btype" value="form" onchange="bodyType()"> Form (a=1&amp;b=2)</label>
                        <button type="button" class="link-btn" id="fmtBtn" onclick="formatJson()">JSON 정렬</button>
                    </div>
                    <textarea class="body-text" id="body" spellcheck="false" placeholder='{ "hello": "world" }'></textarea>
                    <div class="body-hint" id="bodyHint">Content-Type 헤더가 없으면 바디 타입에 맞춰 자동으로 붙습니다. GET/HEAD는 바디를 보내지 않습니다.</div>
                </div>
                <div class="http-body hidden" id="tab-headers">
                    <div id="hdrRows"></div>
                    <button type="button" class="link-btn" onclick="addHeader('', '')">＋ 헤더 추가</button>
                </div>
            </section>

            <!-- 응답 -->
            <section class="http-pane res">
                <div class="http-tabs">
                    <button type="button" class="http-tab active" data-rtab="rbody" onclick="resTab('rbody')">응답 Body</button>
                    <button type="button" class="http-tab" data-rtab="rheaders" onclick="resTab('rheaders')">응답 Headers<span class="http-tab-count" id="rhdrCount"></span></button>
                    <div class="http-tabs-right" id="resMeta"></div>
                </div>
                <div class="http-body" id="tab-rbody">
                    <div class="res-empty" id="resEmpty">요청을 보내면 응답이 여기에 표시됩니다.</div>
                    <pre class="res-pre hidden" id="resBody"></pre>
                </div>
                <div class="http-body hidden" id="tab-rheaders">
                    <table class="res-headers"><tbody id="resHeaders"></tbody></table>
                </div>
            </section>
        </div>
    </main>
</div>

<script>
const HIST_KEY = 'http-client-history';
const HIST_MAX = 50;
const $ = (id) => document.getElementById(id);

// ── 초기화: ?method=&url=&body=&btype=&from=webhook 로 미리 채우기 ──
(function init() {
    const q = new URLSearchParams(location.search);
    if (q.get('method')) $('method').value = q.get('method').toUpperCase();
    if (q.get('url')) $('url').value = q.get('url');
    if (q.get('body') !== null) $('body').value = q.get('body');
    if (q.get('btype')) setBodyType(q.get('btype'));
    if (q.get('from') === 'webhook') {
        const b = $('banner');
        b.innerHTML = '🪝 웹훅 테스트 URL이 채워졌습니다. 파이프라인 에디터에서 <b>▶ 수신 대기</b>가 켜져 있어야 실행되며, '
            + '에디터를 열어 두면 실행 과정이 실시간으로 보입니다. (꺼져 있으면 404 응답)';
        b.classList.remove('hidden');
    }
    if (q.toString()) history.replaceState(null, '', location.pathname); // 새로고침 시 덮어쓰기 방지
    addHeader('', '');
    paintMethod();
    bodyType();
    renderHistory();
    $('url').focus();
})();

document.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); send(); }
});

// ── 요청 편집 ──
function paintMethod() {
    const m = $('method');
    m.className = 'http-method m-' + m.value;
}
function reqTab(name) {
    document.querySelectorAll('[data-tab]').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
    $('tab-body').classList.toggle('hidden', name !== 'body');
    $('tab-headers').classList.toggle('hidden', name !== 'headers');
}
function resTab(name) {
    document.querySelectorAll('[data-rtab]').forEach(b => b.classList.toggle('active', b.dataset.rtab === name));
    $('tab-rbody').classList.toggle('hidden', name !== 'rbody');
    $('tab-rheaders').classList.toggle('hidden', name !== 'rheaders');
}
function getBodyType() { return document.querySelector('input[name=btype]:checked').value; }
function setBodyType(t) {
    const r = document.querySelector(`input[name=btype][value="${t}"]`);
    if (r) r.checked = true;
    bodyType();
}
function bodyType() {
    const t = getBodyType();
    $('body').disabled = t === 'none';
    $('body').style.opacity = t === 'none' ? .4 : 1;
    $('fmtBtn').classList.toggle('hidden', t !== 'json');
}
function formatJson() {
    try { $('body').value = JSON.stringify(JSON.parse($('body').value), null, 2); }
    catch (e) { alertInline('JSON 형식이 올바르지 않습니다: ' + e.message); }
}
function addHeader(k, v) {
    const row = document.createElement('div');
    row.className = 'kv-row';
    row.innerHTML = '<input type="text" class="hk" placeholder="Header (예: Authorization)">'
        + '<input type="text" class="hv" placeholder="Value">'
        + '<button type="button" class="kv-del" title="삭제">✕</button>';
    row.querySelector('.hk').value = k;
    row.querySelector('.hv').value = v;
    row.querySelector('.hk').addEventListener('input', countHeaders);
    row.querySelector('.kv-del').onclick = () => { row.remove(); countHeaders(); };
    $('hdrRows').appendChild(row);
    countHeaders();
}
function readHeaders() {
    return [...document.querySelectorAll('#hdrRows .kv-row')]
        .map(r => ({ key: r.querySelector('.hk').value.trim(), value: r.querySelector('.hv').value }))
        .filter(h => h.key);
}
function countHeaders() {
    const n = readHeaders().length;
    $('hdrCount').textContent = n ? `(${n})` : '';
}
function setHeaders(list) {
    $('hdrRows').innerHTML = '';
    (list && list.length ? list : [{ key: '', value: '' }]).forEach(h => addHeader(h.key, h.value));
}

// ── 보내기 ──
async function send() {
    const method = $('method').value;
    const url = $('url').value.trim();
    if (!url) { alertInline('URL을 입력하세요'); return; }

    const t = getBodyType();
    const headers = readHeaders();
    const body = t === 'none' ? '' : $('body').value;
    const ctMap = { json: 'application/json', text: 'text/plain; charset=UTF-8', form: 'application/x-www-form-urlencoded' };
    if (body && ctMap[t] && !headers.some(h => h.key.toLowerCase() === 'content-type')) {
        headers.push({ key: 'Content-Type', value: ctMap[t] });
    }

    $('sendBtn').disabled = true;
    $('sendBtn').textContent = '보내는 중...';
    $('resMeta').innerHTML = '<span>⏳ 요청 중...</span>';
    try {
        const r = await fetch('/api/http-client/send', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ method, url, headers, body }),
        });
        const res = await r.json();
        showResponse(res);
        pushHistory({ method, url, headers: readHeaders(), body: $('body').value, btype: t,
                      status: res.error ? 'ERR' : res.status, at: new Date().toISOString() });
    } catch (e) {
        showResponse({ error: '앱 서버에 연결할 수 없습니다: ' + e.message });
    } finally {
        $('sendBtn').disabled = false;
        $('sendBtn').textContent = '보내기';
    }
}

function showResponse(res) {
    $('resEmpty').classList.add('hidden');
    const pre = $('resBody');
    pre.classList.remove('hidden');

    if (res.error) {
        $('resMeta').innerHTML = `<span class="status-badge serr">오류</span><span>${res.durationMs ?? 0} ms</span>`;
        pre.textContent = res.error;
        $('resHeaders').innerHTML = '';
        $('rhdrCount').textContent = '';
        return;
    }

    const cls = 's' + String(res.status)[0];
    $('resMeta').innerHTML = `<span class="status-badge ${cls}">${res.status}</span>`
        + `<span>${res.durationMs} ms</span><span>${fmtSize(res.size)}</span>`
        + (res.truncated ? '<span>(2MB까지만 표시)</span>' : '')
        + (res.skippedHeaders ? `<span title="자동 설정되는 헤더">무시된 헤더: ${res.skippedHeaders.join(', ')}</span>` : '');

    let parsed;
    try { parsed = JSON.parse(res.body); } catch (e) { parsed = undefined; }
    if (parsed !== undefined && res.body.trim()) pre.innerHTML = highlightJson(JSON.stringify(parsed, null, 2));
    else pre.textContent = res.body || '(빈 응답)';

    const entries = Object.entries(res.headers || {});
    $('rhdrCount').textContent = entries.length ? `(${entries.length})` : '';
    $('resHeaders').innerHTML = entries
        .map(([k, v]) => `<tr><td>${esc(k)}</td><td>${esc(v)}</td></tr>`).join('');
}

// ── 히스토리 (이 브라우저의 localStorage) ──
function loadHistory() {
    try { return JSON.parse(localStorage.getItem(HIST_KEY)) || []; } catch (e) { return []; }
}
function saveHistory(list) {
    try { localStorage.setItem(HIST_KEY, JSON.stringify(list.slice(0, HIST_MAX))); } catch (e) { /* 저장 불가 시 무시 */ }
}
function pushHistory(item) {
    saveHistory([item, ...loadHistory()]);
    renderHistory();
}
function clearHistory() {
    saveHistory([]);
    renderHistory();
}
function renderHistory() {
    const list = loadHistory();
    const el = $('hist');
    if (!list.length) {
        el.innerHTML = '<div class="http-hist-empty">보낸 요청이 여기에 쌓입니다.<br>클릭하면 다시 불러옵니다.</div>';
        return;
    }
    el.innerHTML = '';
    list.forEach((h) => {
        const d = document.createElement('div');
        d.className = 'http-hist-item';
        d.innerHTML = `<div class="http-hist-top"><span class="m-tag m-${esc(h.method)}">${esc(h.method)}</span>`
            + `<span class="http-hist-url" title="${esc(h.url)}">${esc(shortUrl(h.url))}</span></div>`
            + `<div class="http-hist-meta">${esc(String(h.status))} · ${fmtTime(h.at)}</div>`;
        d.onclick = () => {
            $('method').value = h.method; paintMethod();
            $('url').value = h.url;
            $('body').value = h.body || '';
            setBodyType(h.btype || 'json');
            setHeaders(h.headers);
        };
        el.appendChild(d);
    });
}

// ── 유틸 ──
function esc(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function highlightJson(json) {
    return esc(json).replace(
        /(&quot;(?:\\u[a-fA-F0-9]{4}|\\[^u]|(?!&quot;)[^\\])*&quot;)(\s*:)?|\b(true|false)\b|\bnull\b|-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?/g,
        (m, str, colon, bool) => {
            if (str) return colon ? `<span class="j-key">${str}</span>${colon}` : `<span class="j-str">${str}</span>`;
            if (bool) return `<span class="j-bool">${m}</span>`;
            if (m === 'null') return `<span class="j-null">${m}</span>`;
            return `<span class="j-num">${m}</span>`;
        });
}
function fmtSize(n) { return n < 1024 ? `${n} B` : n < 1048576 ? `${(n / 1024).toFixed(1)} KB` : `${(n / 1048576).toFixed(1)} MB`; }
function fmtTime(iso) { const d = new Date(iso); return isNaN(d) ? '' : d.toLocaleString('ko-KR', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit' }); }
function shortUrl(u) { return String(u).replace(/^https?:\/\//, ''); }
function alertInline(msg) {
    $('resEmpty').classList.add('hidden');
    $('resBody').classList.remove('hidden');
    $('resBody').textContent = msg;
    $('resMeta').innerHTML = '<span class="status-badge serr">확인</span>';
}
</script>
</body>
</html>
