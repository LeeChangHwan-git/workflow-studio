<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout :: head('메모')"></head>
<style>
    /* ── CARD GRID ── */
    .cards-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
        gap: 20px;
    }

    .memo-card {
        background: #fff;
        border-radius: 16px;
        box-shadow: 0 2px 12px rgba(0,0,0,.07);
        overflow: hidden;
        display: flex;
        flex-direction: column;
        transition: transform .18s, box-shadow .18s;
    }
    .memo-card:hover {
        transform: translateY(-3px);
        box-shadow: 0 10px 32px rgba(0,0,0,.13);
    }

    /* 상단 색상 띠 */
    .card-accent { height: 5px; }

    /* 헤더 */
    .card-header {
        padding: 18px 20px 14px;
        display: flex;
        align-items: flex-start;
        gap: 14px;
    }
    .card-icon {
        width: 44px; height: 44px;
        border-radius: 12px;
        display: flex; align-items: center; justify-content: center;
        font-size: 19px; font-weight: 800;
        color: #fff;
        flex-shrink: 0;
        letter-spacing: 0;
    }
    .card-title-wrap { flex: 1; min-width: 0; }
    .card-title {
        font-size: 16px; font-weight: 700;
        color: #1E293B;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        line-height: 1.3;
    }
    .card-category {
        margin-top: 5px;
        display: inline-flex; align-items: center;
        padding: 2px 9px;
        border-radius: 99px;
        font-size: 11px; font-weight: 700;
        letter-spacing: .3px;
    }

    /* 내용 */
    .card-body { padding: 0 20px 14px; flex: 1; }
    .content-block {
        background: #F8FAFC;
        border: 1.5px solid #E8EDF5;
        border-radius: 10px;
        padding: 13px 15px;
        font-family: 'Consolas', 'D2Coding', 'Courier New', monospace;
        font-size: 13px;
        line-height: 1.85;
        color: #334155;
        white-space: pre-wrap;
        word-break: break-all;
        margin: 0;
        max-height: 180px;
        overflow-y: auto;
    }
    .content-block::-webkit-scrollbar { width: 4px; }
    .content-block::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 4px; }

    /* 푸터 */
    .card-footer {
        padding: 12px 20px;
        border-top: 1px solid #F1F5F9;
        display: flex;
        align-items: center;
        gap: 8px;
    }
    .card-date { font-size: 11px; color: #94A3B8; margin-right: auto; }

    /* 복사 버튼 */
    .btn-copy {
        display: inline-flex; align-items: center; gap: 5px;
        height: 32px; padding: 0 13px;
        background: #10B981; color: #fff;
        border: none; border-radius: 8px;
        font-size: 12px; font-weight: 700;
        cursor: pointer; transition: all .15s;
    }
    .btn-copy:hover { background: #059669; }
    .btn-copy.copied { background: #64748B; }

    /* 수정/삭제 */
    .btn-sm {
        display: inline-flex; align-items: center;
        height: 32px; padding: 0 12px;
        border-radius: 8px; font-size: 12px; font-weight: 600;
        text-decoration: none; cursor: pointer; border: none;
        transition: all .15s;
    }
    .btn-edit   { background: #EEF2FF; color: #6366F1; }
    .btn-edit:hover { background: #E0E7FF; }
    .btn-del    { background: #FEF2F2; color: #EF4444; }
    .btn-del:hover  { background: #FEE2E2; }
</style>
<body>
<nav>
    <div class="nav-brand">
        <div class="nav-brand-icon">🗂</div>
        내 메모
    </div>
    <a th:href="@{/memos}"     class="nav-link active">메모</a>
    <a th:href="@{/bookmarks}" class="nav-link">북마크</a>
    <a th:href="@{/calendar}"  class="nav-link">달력</a>
</nav>

<div class="container">
    <div class="page-header">
        <div>
            <div class="page-title">메모</div>
            <div class="page-sub" th:text="${memos.size()} + '개의 메모'"></div>
        </div>
        <a th:href="@{/memos/new}" class="btn btn-primary btn-lg">＋ 새 메모</a>
    </div>

    <div class="search-wrap">
        <form method="get" th:action="@{/memos}" style="display:flex;gap:8px;flex:1;">
            <input class="search-input" type="text" name="search"
                   placeholder="시스템명, 내용으로 검색..." th:value="${search}"/>
            <button type="submit" class="btn btn-primary">검색</button>
            <a th:href="@{/memos}" class="btn btn-ghost">전체</a>
        </form>
    </div>

    <div th:if="${memos.isEmpty()}" class="empty-state">
        <div class="empty-icon">🔐</div>
        <div class="empty-text">저장된 메모가 없습니다.<br>새 메모를 추가해보세요.</div>
    </div>

    <div class="cards-grid" th:if="${!memos.isEmpty()}">
        <!--
            색상 팔레트 (accent / icon bg / badge bg / badge text)
            index % 8 로 순환
        -->
        <th:block th:each="memo, stat : ${memos}">
            <th:block th:with="
                ci=${stat.index % 8},
                accent=${ci==0?'linear-gradient(90deg,#6366F1,#8B5CF6)':
                         ci==1?'linear-gradient(90deg,#EF4444,#F97316)':
                         ci==2?'linear-gradient(90deg,#10B981,#06B6D4)':
                         ci==3?'linear-gradient(90deg,#F59E0B,#EAB308)':
                         ci==4?'linear-gradient(90deg,#8B5CF6,#EC4899)':
                         ci==5?'linear-gradient(90deg,#06B6D4,#3B82F6)':
                         ci==6?'linear-gradient(90deg,#F97316,#EF4444)':
                               'linear-gradient(90deg,#64748B,#475569)'},
                iconBg=${ci==0?'#6366F1':ci==1?'#EF4444':ci==2?'#10B981':ci==3?'#F59E0B':
                          ci==4?'#8B5CF6':ci==5?'#06B6D4':ci==6?'#F97316':'#64748B'},
                badgeBg=${ci==0?'#EEF2FF':ci==1?'#FEF2F2':ci==2?'#ECFDF5':ci==3?'#FFFBEB':
                           ci==4?'#F5F3FF':ci==5?'#ECFEFF':ci==6?'#FFF7ED':'#F8FAFC'},
                badgeColor=${ci==0?'#6366F1':ci==1?'#EF4444':ci==2?'#10B981':ci==3?'#D97706':
                              ci==4?'#8B5CF6':ci==5?'#0891B2':ci==6?'#EA580C':'#64748B'},
                initial=${#strings.substring(memo.title,0,1).toUpperCase()}
            ">
                <div class="memo-card">
                    <div class="card-accent" th:style="'background:' + ${accent}"></div>

                    <div class="card-header">
                        <div class="card-icon" th:style="'background:' + ${iconBg}"
                             th:text="${initial}"></div>
                        <div class="card-title-wrap">
                            <div class="card-title" th:text="${memo.title}"></div>
                            <span class="card-category"
                                  th:if="${memo.category != null and !memo.category.isEmpty()}"
                                  th:style="'background:'+${badgeBg}+';color:'+${badgeColor}"
                                  th:text="${memo.category}"></span>
                        </div>
                    </div>

                    <div class="card-body">
                        <pre class="content-block"
                             th:id="'c-' + ${memo.id}"
                             th:text="${memo.content}"></pre>
                    </div>

                    <div class="card-footer">
                        <span class="card-date"
                              th:text="${#temporals.format(memo.updatedAt,'yyyy.MM.dd HH:mm')}"></span>
                        <button class="btn-copy"
                                th:data-target="'c-' + ${memo.id}"
                                onclick="copyContent(this)">
                            📋 복사
                        </button>
                        <a th:href="@{/memos/{id}/edit(id=${memo.id})}" class="btn-sm btn-edit">✏ 수정</a>
                        <form th:action="@{/memos/{id}/delete(id=${memo.id})}" method="post"
                              style="display:inline;" onsubmit="return confirm('삭제하시겠습니까?')">
                            <button type="submit" class="btn-sm btn-del">🗑 삭제</button>
                        </form>
                    </div>
                </div>
            </th:block>
        </th:block>
    </div>
</div>

<script>
function copyContent(btn) {
    const id = btn.getAttribute('data-target').replace(/^'|'$/g, '');
    const text = document.getElementById(id).innerText;

    // navigator.clipboard 미지원(JavaFX WebView) 시 execCommand 방식으로 폴백
    const tryClipboard = navigator.clipboard
        ? navigator.clipboard.writeText(text).then(() => showCopied(btn)).catch(() => fallbackCopy(btn, text))
        : fallbackCopy(btn, text);
}

function fallbackCopy(btn, text) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;opacity:0;top:0;left:0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    showCopied(btn);
}

function showCopied(btn) {
    const orig = btn.innerHTML;
    btn.innerHTML = '✅ 복사됨';
    btn.classList.add('copied');
    setTimeout(() => { btn.innerHTML = orig; btn.classList.remove('copied'); }, 1500);
}
</script>
</body>
</html>
