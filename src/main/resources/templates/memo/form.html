<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout :: head('메모 작성')"></head>
<body>
<nav>
    <div class="nav-brand">
        <div class="nav-brand-icon">🗂</div>
        내 메모
    </div>
    <a th:href="@{/memos}"     class="nav-link active">메모</a>
    <a th:href="@{/bookmarks}" class="nav-link">북마크</a>
    <a th:href="@{/calendar}"  class="nav-link">달력</a>
    <a th:href="@{/pipelines}" class="nav-link">파이프라인</a>
    <a th:href="@{/settings}"  class="nav-link">설정</a>
</nav>
<div class="container" style="max-width:640px;">
    <div class="page-header">
        <div>
            <div class="page-title" th:text="${memo.id != null} ? '메모 수정' : '새 메모'"></div>
            <div class="page-sub">시스템명과 계정 정보를 입력하세요</div>
        </div>
    </div>
    <div class="form-card">
        <form th:action="${memo.id != null} ? @{/memos/{id}(id=${memo.id})} : @{/memos}" method="post">
            <div class="form-group">
                <label class="form-label">시스템명 *</label>
                <input class="form-control" type="text" name="title"
                       th:value="${memo.title}" required placeholder="예: Gmail, 사내 인트라넷, AWS Console"/>
            </div>
            <div class="form-group">
                <label class="form-label">카테고리</label>
                <input class="form-control" type="text" name="category"
                       th:value="${memo.category}" placeholder="예: 업무, 개인, 개발, 금융"/>
            </div>
            <div class="form-group">
                <label class="form-label">내용 *</label>
                <textarea class="form-control mono" name="content" required
                          placeholder="ID: example@email.com&#10;PW: password123&#10;URL: https://...&#10;메모: 2FA 사용중"
                          th:text="${memo.content}"></textarea>
            </div>
            <div class="form-actions">
                <a class="btn btn-primary btn-lg" onclick="this.closest('form').submit()">저장</a>
                <a th:href="@{/memos}" class="btn btn-ghost btn-lg">취소</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
