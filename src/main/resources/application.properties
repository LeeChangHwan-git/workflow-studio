# 웹 접속 주소: http://localhost:8080
server.port=8080
# 매크로(마우스/키보드 제어) 기능이 있으므로 기본은 이 PC에서만 접속 허용.
# 다른 기기에서도 접속하려면 0.0.0.0 으로 변경 (보안 주의)
server.address=127.0.0.1

# 기동 완료 시 기본 브라우저 자동 열기 (자동 시작 등록 시에는 false 로 실행)
app.open-browser=true

app.storage.path=./data

# 화면 템플릿 캐시 (항상 켜 두는 실행에서는 true — 개발 중 템플릿을 바로 반영하려면 false)
spring.thymeleaf.cache=true
spring.thymeleaf.encoding=UTF-8
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# 로그: 화면 대신 파일에도 남기고 자동으로 정리 (10MB씩, 7일, 전체 100MB 이내)
logging.file.name=./logs/workflow-studio.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7
logging.logback.rollingpolicy.total-size-cap=100MB
logging.level.root=INFO
# 템플릿 문법 경고(동작에는 영향 없음)가 화면 열 때마다 쌓이지 않도록
logging.level.org.thymeleaf.standard.processor=ERROR

# 정적 파일 캐시 무효화: 템플릿의 @{...} 링크가 내용 해시가 붙은 주소(app-<해시>.js)로 바뀜
# → 새로 빌드하면 브라우저가 옛 에디터 스크립트를 쓰지 않음
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/pipeline-editor/**
