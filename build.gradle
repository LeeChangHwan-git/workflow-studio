plugins {
    id 'org.springframework.boot' version '3.2.5'
    id 'io.spring.dependency-management' version '1.1.5'
    id 'java'
}

group = 'com.app'
version = '1.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_17
}

configurations {
    compileOnly { extendsFrom annotationProcessor }
    javafxDev   // 개발용 (macOS aarch64) — 컴파일 + 로컬 실행
    javafxWin   // 배포용 (Windows) — dist/libs 복사
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'

    // JavaFX (macOS aarch64 — 개발 머신)
    javafxDev 'org.openjfx:javafx-base:21.0.2:mac-aarch64'
    javafxDev 'org.openjfx:javafx-controls:21.0.2:mac-aarch64'
    javafxDev 'org.openjfx:javafx-graphics:21.0.2:mac-aarch64'
    javafxDev 'org.openjfx:javafx-web:21.0.2:mac-aarch64'
    javafxDev 'org.openjfx:javafx-fxml:21.0.2:mac-aarch64'
    javafxDev 'org.openjfx:javafx-media:21.0.2:mac-aarch64'

    // JavaFX (Windows 배포용)
    javafxWin 'org.openjfx:javafx-base:21.0.2:win'
    javafxWin 'org.openjfx:javafx-controls:21.0.2:win'
    javafxWin 'org.openjfx:javafx-graphics:21.0.2:win'
    javafxWin 'org.openjfx:javafx-web:21.0.2:win'
    javafxWin 'org.openjfx:javafx-fxml:21.0.2:win'
    javafxWin 'org.openjfx:javafx-media:21.0.2:win'
}

// JavaFX를 module-path로 컴파일
compileJava {
    doFirst {
        options.compilerArgs += [
            '--module-path', configurations.javafxDev.asPath,
            '--add-modules', 'javafx.base,javafx.controls,javafx.graphics,javafx.web,javafx.fxml,javafx.media'
        ]
    }
}

tasks.named('test') {
    useJUnitPlatform()
}

// ── 파이프라인 에디터 프론트엔드 (React + React Flow) 빌드 연동 ──
def frontendDir = file('frontend/pipeline-editor')
def npmExecutable = org.gradle.internal.os.OperatingSystem.current().isWindows() ? 'npm.cmd' : 'npm'

tasks.register('npmInstall', Exec) {
    workingDir frontendDir
    commandLine npmExecutable, 'install'
    inputs.file("${frontendDir}/package.json")
    outputs.dir("${frontendDir}/node_modules")
}

tasks.register('npmBuildFrontend', Exec) {
    dependsOn npmInstall
    workingDir frontendDir
    commandLine npmExecutable, 'run', 'build'
    inputs.dir("${frontendDir}/src")
    inputs.file("${frontendDir}/vite.config.ts")
    outputs.dir('src/main/resources/static/pipeline-editor')
}

processResources.dependsOn npmBuildFrontend

// bootJar: Start-Class 를 Launcher 로 설정
springBoot {
    mainClass = 'com.app.memobookmark.Launcher'
}

// 로컬 실행 태스크 (macOS) — java -jar + --module-path
tasks.register('runApp', Exec) {
    dependsOn bootJar
    def jfxPath = configurations.javafxDev.asPath
    def jarFile = bootJar.archiveFile.get().asFile.absolutePath
    commandLine 'java',
        '--module-path', jfxPath,
        '--add-modules', 'javafx.base,javafx.controls,javafx.graphics,javafx.web,javafx.fxml,javafx.media',
        '-jar', jarFile
}

// Windows 배포용 JavaFX libs 복사 (win 네이티브 JAR만)
tasks.register('copyJavafxWin', Copy) {
    from(configurations.javafxWin) {
        include '*-win.jar'
    }
    into 'dist/libs'
}

tasks.register('makeDist', Zip) {
    dependsOn bootJar, 'copyJavafxWin'
    archiveFileName = 'memo-bookmark-app.zip'
    destinationDirectory = file('dist')

    from(bootJar.archiveFile) { into '.' }
    from('dist/libs') { into 'libs' }
    from('dist/application.properties') { into '.' }
    from('dist/실행.bat') { into '.' }
    from('dist/저장경로변경.bat') { into '.' }
}
