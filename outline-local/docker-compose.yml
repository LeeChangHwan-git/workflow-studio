version: "3.8"

services:

  # ── PostgreSQL ──────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: outline
      POSTGRES_PASSWORD: outline_pass
      POSTGRES_DB: outline
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U outline"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Redis ───────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── MinIO (S3 호환 로컬 스토리지) ──────────────────────────────
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"    # MinIO 콘솔
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO 버킷 초기 생성
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/outline &&
        mc anonymous set download local/outline
      "

  # ── MailHog (로컬 SMTP + 웹 메일) ──────────────────────────────
  mailhog:
    image: mailhog/mailhog:latest
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # 웹 UI (받은 메일 확인)

  # ── Outline ─────────────────────────────────────────────────────
  outline:
    image: outlinewiki/outline:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "3000:3000"
    environment:
      # 기본 설정
      SECRET_KEY: "71acde7b93828054abe2275d8a82db8cc6e73068a6e4915f1a85288e4ff0f196"
      UTILS_SECRET: "d9b67c9686f4d405a84116b9295557f779ee38bee57be1eb85207fdb66cc479b"
      URL: "http://localhost:3000"
      PORT: "3000"
      NODE_ENV: "production"
      FORCE_HTTPS: "false"

      # DB / Redis
      DATABASE_URL: "postgres://outline:outline_pass@postgres:5432/outline"
      PGSSLMODE: "disable"
      REDIS_URL: "redis://redis:6379"

      # 파일 스토리지 (MinIO)
      FILE_STORAGE: "s3"
      AWS_ACCESS_KEY_ID: "minioadmin"
      AWS_SECRET_ACCESS_KEY: "minioadmin"
      AWS_REGION: "us-east-1"
      AWS_S3_UPLOAD_BUCKET_NAME: "outline"
      AWS_S3_UPLOAD_BUCKET_URL: "http://minio:9000"
      AWS_S3_FORCE_PATH_STYLE: "true"
      AWS_S3_ACL: "private"

      # 이메일 (MailHog)
      SMTP_HOST: "mailhog"
      SMTP_PORT: "1025"
      SMTP_FROM_EMAIL: "hello@outline.local"
      SMTP_REPLY_EMAIL: "hello@outline.local"
      SMTP_SECURE: "false"
      SMTP_TLS_CIPHERS: ""

      # 인증: 이메일 로그인 허용
      EMAIL_ENABLED: "true"

volumes:
  postgres_data:
  minio_data:
